        const ClientsModule = createEntityModule({
            table: 'clients', prefix: 'CL', sheet: 'clients',
            list: () => State.clients,
            fields: {
                code:'cCode', login:'cLogin', name:'cName', phone:'cPhone', phone2:'cPhone2',
                email:'cEmail', address:'cAddress', taxId:'cTaxId',
                openingBalance:'cOpeningBalance', balance:'cBalance'
            },
            renderer: ClientsRenderer,
            async validate() {
                const login = $('cLogin').value.trim();
                const name = $('cName').value.trim();
                const email = $('cEmail').value.trim().toLowerCase();
                const password = $('cPassword').value.trim();
                if (!name) { Toast.show('Entrez le nom'); return false; }
                if (!login) {
                    $('cLoginError').textContent = '⚠️ Login requis';
                    Toast.show('⚠️ Login requis'); return false;
                }
                if (!Utils.isValidLogin(login)) {
                    $('cLoginError').textContent = '⚠️ Lettres, chiffres et _ (min 3)';
                    Toast.show('⚠️ Login invalide'); return false;
                }
                // ✅ إصلاح: التحقق من تكرار الـ Login (case-insensitive)
                const loginLower = login.toLowerCase();
                const dupLogin = State.clients.find(c =>
                    c.id !== this.editingId && 
                    (c.login || '').toLowerCase() === loginLower
                );
                if (dupLogin) {
                    $('cLoginError').textContent = `⚠️ Login "${login}" déjà utilisé par "${dupLogin.name}"`;
                    Toast.show(`⚠️ Login déjà pris`); 
                    return false;
                }
                // ✅ التحقق أيضاً في Firebase
                if (window.db) {
                    try {
                        const existing = await ClientLoginsSync.lookup(login);
                        if (existing && existing.id !== this.editingId) {
                            $('cLoginError').textContent = `⚠️ Login "${login}" existe déjà (cloud)`;
                            Toast.show(`⚠️ Login déjà pris (cloud)`); 
                            return false;
                        }
                    } catch(e) {
                        console.warn('⚠️ Cloud check skipped:', e.message);
                    }
                }
                $('cLoginError').textContent = '';
                if (email && !Utils.isValidEmail(email)) {
                    $('cEmailError').textContent = '⚠️ Email invalide';
                    Toast.show('⚠️ Email invalide'); return false;
                }
                $('cEmailError').textContent = '';
                if (!this.editingId) {
                    if (!password) {
                        $('cPasswordError').textContent = '⚠️ Mot de passe requis';
                        Toast.show('⚠️ Mot de passe requis'); return false;
                    }
                    if (password.length < 6) {
                        $('cPasswordError').textContent = '⚠️ Min 6 caractères';
                        Toast.show('⚠️ Min 6 caractères'); return false;
                    }
                }
                $('cPasswordError').textContent = '';
                return true;
            },
            async collect() {
                const plainPwd = $('cPassword').value.trim();
                let passwordHash, salt;
                if (plainPwd) {
                    salt = Utils.generateSalt();
                    passwordHash = await Utils.hashPassword(plainPwd, salt);
                } else if (this.editingId) {
                    const existing = State.clients.find(c => c.id === this.editingId);
                    passwordHash = existing?.passwordHash;
                    salt = existing?.passwordSalt;
                }
                return {
                    login: $('cLogin').value.trim(),
                    name: $('cName').value.trim(),
                    phone: $('cPhone').value, phone2: $('cPhone2').value,
                    email: $('cEmail').value.trim().toLowerCase(),
                    address: $('cAddress').value, taxId: $('cTaxId').value,
                    openingBalance: parseFloat($('cOpeningBalance').value) || 0,
                    balance: parseFloat($('cBalance').value) || 0,
                    passwordHash, passwordSalt: salt,
                    specialPrices: [...this._specialPrices]
                };
            },
            canDelete(c) {
                const hasV = State.ventes.some(v => v.client === c.name);
                const hasP = State.caisseClients.some(x => x.clientName === c.name);
                if (!hasV && !hasP) return true;
                Toast.show(`🚫 Factures ou règlements existants`);
                return false;
            },
            onReset() {
                this._specialPrices = [];
                this.renderSpecialPrices();
                this.refreshSpArticleOptions();
                this.updateSummary();
                if ($('cPasswordError')) $('cPasswordError').textContent = '';
                if ($('cLoginError')) $('cLoginError').textContent = '';
                if ($('cPassword')) $('cPassword').value = '';
                if ($('cDisplayLogin')) $('cDisplayLogin').textContent = '-';
            },
            onLoad(c) {
                this._specialPrices = c.specialPrices ? [...c.specialPrices] : [];
                this.renderSpecialPrices();
                this.refreshSpArticleOptions();
                this.updateSummary();
                if ($('cPasswordError')) $('cPasswordError').textContent = '';
                if ($('cLoginError')) $('cLoginError').textContent = '';
                if ($('cPassword')) $('cPassword').value = '';
                if ($('cDisplayLogin')) $('cDisplayLogin').textContent = c.login || '-';
            },
            async onSave(data) {
                BalanceCalculator.recalculateClient(data.name);
                // ✅ إصلاح: مزامنة Login مع Firebase
                const client = State.clients.find(c => c.login === data.login);
                if (client && client.passwordHash) {
                    await ClientLoginsSync.syncOne(client);
                }
            },
            async onDelete(item) {
                // ✅ إصلاح: حذف Login من Firebase
                if (item.login) {
                    await ClientLoginsSync.deleteOne(item.login);
                }
            }
        });

        Object.assign(ClientsModule, {

                const input = $('cPassword');

                input.type = isPwd ? 'text' : 'password';
                $('cPwdToggle').textContent = isPwd ? '🙈' : '👁️';

            generatePassword() {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                let pwd = '';
                for (let i = 0; i < 8; i++) pwd += chars.charAt(Math.floor(Math.random() * chars.length));
                $('cPassword').value = pwd;
                $('cPasswordError').textContent = '';
                Toast.show(`🎲 Mot de passe: ${pwd}`, 'success');

                sel.innerHTML = '<option value="">-- Choisir --</option>' +

            addSpecialPrice() {
                const sel = $('spArticleSelect');

                const id = parseInt(sel.value);

                const a = State.articles.find(x => x.id === id);

                const price = parseFloat(priceInput.value) || 0;

                this._specialPrices.push({ name: a.name, price });
                this.renderSpecialPrices();
                this.refreshSpArticleOptions();
                priceInput.value = '';
                Toast.show('✅ Ajouté');

            removeSpecialPrice(i) {

            updateSummary() {

                const ids = { opening:'cDisplayOpening', purchases:'cDisplayTotalPurchases', payments:'cDisplayTotalPayments', balance:'cDisplayBalance' };
                if (!c) { Object.values(ids).forEach(id => $(id).textContent = '0.000'); return; }
                const tp = State.ventes.filter(v => v.client === c.name).reduce((s, v) => s + v.total, 0);
                const tpay = State.caisseClients.filter(x => x.clientName === c.name).reduce((s, x) => s + x.amount, 0);

                $(ids.opening).textContent = open.toFixed(3);
                $(ids.purchases).textContent = tp.toFixed(3);
                $(ids.payments).textContent = tpay.toFixed(3);
                $(ids.balance).textContent = (open + tp - tpay).toFixed(3);
            }

        const Orders = {
            filter: 'pending',
            _unsubscribe: null,
            startRealtimeListener() {
                if (typeof firebase === 'undefined') return;
                if (this._unsubscribe) this._unsubscribe();
                const fbUser = firebase.auth().currentUser;
                if (!fbUser) return;
                try {
                    this._unsubscribe = firebase.firestore().collection('orders')
                        .orderBy('createdAt', 'desc')
                        .limit(100)
                        .onSnapshot(snapshot => {
                            let changed = false;
                            snapshot.docChanges().forEach(change => {
                                const data = change.doc.data();
                                const cloudId = change.doc.id;
                                const existingIdx = State.orders.findIndex(o =>
                                    o.cloudId === cloudId ||
                                    (o.num === data.num && o.clientName === data.clientName)
                                );
                                if (change.type === 'added' || change.type === 'modified') {
                                    const merged = { ...data, cloudId };
                                    if (existingIdx === -1) {
                                        State.orders.push(merged);
                                        changed = true;
                                        if (!merged.updatedByStaff && merged.source === 'client-portal') {
                                            NotificationSystem.add(
                                                '🛒 Nouvelle commande',
                                                `${data.clientName} — ${(data.total || 0).toFixed(3)} TND`,
                                                'WARNING'
                                            );
                                        }
                                    } else {
                                        State.orders[existingIdx] = { ...State.orders[existingIdx], ...merged };
                                        changed = true;
                                    }
                                } else if (change.type === 'removed' && existingIdx !== -1) {
                                    State.orders.splice(existingIdx, 1); changed = true;
                                }
                            });
                            if (changed) {
                                Persistence.save();
                                if (State.currentSection === 'orders') this.render();
                            }
                        }, err => console.error('❌ Firestore listener error:', err));
                } catch(e) { console.error('❌ Cannot start listener:', e); }
            },
            stopRealtimeListener() {
                if (this._unsubscribe) { this._unsubscribe(); this._unsubscribe = null; }
            },
            async updateCloudStatus(order, newStatus) {
                if (typeof firebase === 'undefined' || !order.cloudId) return;
                try {
                    await firebase.firestore().collection('orders').doc(order.cloudId).update({
                        status: newStatus,
                        updatedAt: new Date().toISOString(),
                        updatedByStaff: true
                    });
                } catch(e) {
                    console.error('❌ Update cloud error:', e.message);
                }
            },
            get(id) {
                return State.orders.find(o => o.id === id || o.cloudId === id);
            },
            render() {
                const list = $('ordersList');
                if (!list) return;
                const q = ($('ordersSearch')?.value || '').trim().toLowerCase();
                let filtered = [...State.orders].sort((a, b) =>
                    (b.createdAt || b.date) < (a.createdAt || a.date) ? -1 : 1
                );
                if (this.filter !== 'all') filtered = filtered.filter(o => o.status === this.filter);
                if (q) filtered = filtered.filter(o =>
                    o.clientName.toLowerCase().includes(q) || o.num.toLowerCase().includes(q)
                );
                if (!filtered.length) { list.innerHTML = '<div class="empty-msg">📭 Aucune commande</div>'; return; }
                const statusMap = {
                    pending:  { lbl: '⏳ En attente', cls: 'pending' },
                    approved: { lbl: '✅ Acceptée',   cls: 'paid' },
                    rejected: { lbl: '❌ Refusée',    cls: 'partial' },
                    delivered:{ lbl: '🚚 Livrée',     cls: 'paid' }
                };
                list.innerHTML = filtered.map(o => {
                    const s = statusMap[o.status] || statusMap.pending;
                    const orderKey = o.cloudId || o.id;
                    const keyStr = Utils.escapeAttr(orderKey);
                    const linesPreview = o.lines.slice(0, 3).map(l =>
                        `<div style="font-size:9px;color:var(--muted);">• ${esc(l.name)} × ${Number(l.qty)||0} = ${(Number(l.total)||0).toFixed(3)} TND</div>`
                    ).join('');
                    const more = o.lines.length > 3 ? `<div style="font-size:8px;color:var(--muted);">... +${o.lines.length - 3}</div>` : '';
                    const stockBadge = o.stockDecremented ? '<span style="font-size:8px;background:#d4f4dd;color:#27ae60;padding:1px 6px;border-radius:8px;margin-left:4px;">📦 Stock -</span>' : '';
                    return `
                    <div class="row-card" style="flex-direction:column;align-items:stretch;cursor:default;">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <div>
                                <div class="name">${esc(o.num)} <span class="cp-badge ${s.cls}" style="margin-left:4px;">${s.lbl}</span>${stockBadge}</div>
                                <div class="meta">👤 ${esc(o.clientName)} • 📅 ${esc(Utils.formatDate(o.date))} ${esc(o.time || '')}</div>
                            </div>
                            <div class="amount" style="font-size:13px;">${(Number(o.total)||0).toFixed(3)} TND</div>
                        </div>
                        <div style="margin-top:6px;padding:6px;background:var(--bg);border-radius:8px;">
                            ${linesPreview}${more}
                        </div>
                        ${o.note ? `<div style="font-size:9px;color:var(--muted);margin-top:4px;">📝 ${esc(o.note)}</div>` : ''}
                        <div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;">
                            ${o.status === 'pending' ? `
                                <button class="btn save small" style="flex:1;padding:4px;font-size:9px;" onclick="Orders.approve('${keyStr}')">✅ Accepter</button>
                                <button class="btn del small" style="flex:1;padding:4px;font-size:9px;" onclick="Orders.reject('${keyStr}')">❌ Refuser</button>
                            ` : ''}
                            ${o.status === 'approved' ? `
                                <button class="btn save small" style="flex:1;padding:4px;font-size:9px;" onclick="Orders.convertToSale('${keyStr}')">📄 → Facture</button>
                            ` : ''}
                            <button class="btn outline small" style="flex:1;padding:4px;font-size:9px;" onclick="Orders.callClient('${keyStr}')">📞 Appeler</button>
                            <button class="btn del small" style="padding:4px;font-size:9px;" onclick="Orders.remove('${keyStr}')">🗑️</button>
                        </div>
                    </div>`;
                }).join('');
            },
            approve(id) {
                const o = this.get(id);
                if (!o) { Toast.show('❌ Commande introuvable', 'error'); return; }
                if (!o.stockDecremented) {
                    const warnings = [];
                    o.lines.forEach(line => {
                        const article = State.articles.find(a => a.name === line.name);
                        if (!article) { warnings.push(`"${line.name}" introuvable`); return; }
                        if ((article.stock || 0) < line.qty) warnings.push(`"${line.name}": stock ${article.stock || 0} < ${line.qty}`);
                        Stock.adjust(line.name, -line.qty, { silent: true, allowNegative: true });
                    });
                    o.stockDecremented = true;
                    o.stockDecrementedAt = new Date().toISOString();
                    if (warnings.length) Toast.show(`⚠️ Stock: ${warnings.length} article(s)`, 'warning');
                }
                o.status = 'approved';
                o.approvedAt = new Date().toISOString();
                Persistence.save();
                this.updateCloudStatus(o, 'approved');
                this.render();
                Toast.show('✅ Commande acceptée', 'success');
                NotificationSystem.add('Commande acceptée', `${o.num} — ${o.clientName}`, 'SUCCESS');
            },
            reject(id) {
                const o = this.get(id);
                if (!o) return;
                if (o.stockDecremented) {
                    o.lines.forEach(line => {
                        Stock.adjust(line.name, line.qty, { silent: true, allowNegative: true });
                    });
                    o.stockDecremented = false;
                }
                o.status = 'rejected';
                o.rejectedAt = new Date().toISOString();
                Persistence.save();
                this.updateCloudStatus(o, 'rejected');
                this.render();
                Toast.show('❌ Commande refusée');
            },
            async remove(id) {
                const o = this.get(id);
                if (!o) return;
                const ok = await CustomConfirm.show(`Supprimer la commande ${o.num} ?`);
                if (!ok) return;
                if (o.stockDecremented) {
                    o.lines.forEach(line => {
                        Stock.adjust(line.name, line.qty, { silent: true, allowNegative: true });
                    });
                }
                if (typeof firebase !== 'undefined' && o.cloudId) {
                    try { await firebase.firestore().collection('orders').doc(o.cloudId).delete(); } catch(e) {}
                }
                const idx = State.orders.findIndex(x =>
                    (x.cloudId && x.cloudId === o.cloudId) ||
                    (!x.cloudId && x.id === o.id)
                );
                if (idx !== -1) State.orders.splice(idx, 1);
                Persistence.save();
                this.render();
                Toast.show('🗑️ Supprimée');
            },
            callClient(id) {
                const o = this.get(id);
                if (!o || !o.phone) { Toast.show('⚠️ Pas de téléphone'); return; }
                const phone = o.phone.replace(/\D/g, '');
                window.location.href = `tel:${phone}`;
            },
            convertToSale(id) {
                const o = this.get(id);
                if (!o) return;
                if (VentesModule.editingId || VentesModule.lines.length) {
                    CustomConfirm.show('⚠️ Facture en cours non enregistrée. Continuer ?').then(ok => {
                        if (ok) this._doConvert(o);
                    });
                } else {
                    this._doConvert(o);
                }
            },
            _doConvert(o) {
                VentesModule.reset();
                App.openSheet('ventes');
                if (o.clientId) {
                    const client = State.clients.find(c => c.id === o.clientId);
                    if (client) {
                        VentesModule.refreshPartyOptions();
                        const sel = $('vClient');
                        const opt = [...sel.options].find(x => x.textContent === client.name);
                        if (opt) {
                            sel.value = opt.value;
                            VentesModule.fillParty();
                        }
                    }
                }
                o.lines.forEach(l => {
                    const existing = VentesModule.lines.find(x => x.name === l.name);
                    if (existing) { existing.qty += l.qty; existing.total = existing.price * existing.qty; }
                    else VentesModule.lines.push({ name: l.name, price: l.price, qty: l.qty, total: l.total });
                });
                VentesModule.renderLines();
                VentesModule.refreshArticleOptions();
                VentesModule.updateAccountSummary();
                VentesModule._skipStockAdjust = true;
                o.status = 'delivered';
                o.deliveredAt = new Date().toISOString();
                Persistence.save();
                this.updateCloudStatus(o, 'delivered');
                Toast.show('📄 Commande chargée (stock déjà mis à jour)', 'success');
            }
        };

        // ═══════════════════════════════════════════════════
        // 💸 Expenses
        // ═══════════════════════════════════════════════════
        const Expenses = {
            editingId: null,
            reset() {
                this.editingId = null;
                $('exCode').value = 'EXP-' + String(State.nextId.expenses).padStart(4, '0');
                $('exDate').value = Utils.today();
                $('exCategory').selectedIndex = 0;
                $('exAmount').value = '';
                $('exDesc').value = '';
            },
            save() {
                const amount = parseFloat($('exAmount').value) || 0;
                if (amount <= 0) { Toast.show('Montant invalide'); return; }
                const rec = {
                    id: this.editingId || State.nextId.expenses++,
                    code: $('exCode').value.trim(),
                    date: $('exDate').value,
                    category: $('exCategory').options[$('exCategory').selectedIndex].textContent,
                    amount,
                    description: $('exDesc').value.trim() || '-'
                };
                if (this.editingId) {
                    const i = State.expenses.findIndex(e => e.id === this.editingId);
                    if (i !== -1) State.expenses[i] = rec;
                } else State.expenses.push(rec);
                Persistence.save();
                this.render();
                App.closeSheet();
                Toast.show(this.editingId ? '✅ Modifié' : '✅ Enregistré');
            },
            edit() { if (!this.editingId) return; this.save(); },
            async remove() {
                if (!this.editingId) return;
                const i = State.expenses.findIndex(e => e.id === this.editingId);
                if (i === -1) return;
                const ok = await CustomConfirm.show('Supprimer cette dépense ?');
                if (!ok) return;
                State.expenses.splice(i, 1);
                Persistence.save();
                this.render();
                App.closeSheet();
                Toast.show('🗑️ Supprimé');
            },
            load(id) {
                const e = State.expenses.find(x => x.id === id);
                if (!e) return;
                this.editingId = id;
                $('exCode').value = e.code || 'EXP-' + String(id).padStart(4, '0');
                $('exDate').value = e.date;
                const opt = [...$('exCategory').options].find(o => o.textContent === e.category);
                if (opt) $('exCategory').value = opt.value;
                $('exAmount').value = e.amount;
                $('exDesc').value = e.description === '-' ? '' : e.description;
                App.openSheet('expenses');
            },
            render() {
                const total = State.expenses.reduce((s, e) => s + e.amount, 0);
                if ($('expensesTotal')) $('expensesTotal').textContent = total.toFixed(3) + ' TND';
                const list = $('expensesList');
                if (!list) return;
                list.innerHTML = '';
                const q = ($('expSearch')?.value || '').trim().toLowerCase();
                const filtered = State.expenses
                    .filter(e => !q || e.category.toLowerCase().includes(q) || e.description.toLowerCase().includes(q))
                    .sort((a, b) => a.date < b.date ? 1 : -1);
                if (!filtered.length) { list.innerHTML = '<div class="empty-msg">Aucune dépense</div>'; return; }
                filtered.slice(0, 100).forEach(e => {
                    const d = document.createElement('div');
                    d.className = 'row-card';
                    d.onclick = () => this.load(e.id);
                    const code = e.code || 'EXP-' + String(e.id).padStart(4, '0');
                    d.innerHTML = `<div><div class="name">${esc(code)} - ${esc(e.category)}</div>
                        <div class="meta">${esc(e.date)}${e.description !== '-' ? ' - ' + esc(e.description) : ''}</div></div>
                        <div class="amount" style="color:var(--danger);">-${e.amount.toFixed(3)} TND</div>`;
                    list.appendChild(d);
                });
            }
        };

        // ═══════════════════════════════════════════════════
        // 📜 createHistoryModule
        // ═══════════════════════════════════════════════════
        function createHistoryModule(cfg) {
            return {
                currentId: null,
                render() {
                    const container = $(cfg.container);
                    if (!container) return;
                    const from = Utils.monthStart();
                    const to = Utils.today();
                    container.innerHTML = `
                        <div class="field-row-2">
                            <div class="field"><label>📅 Du</label><input type="date" id="${cfg.prefix}From" value="${from}" onchange="${cfg.name}.show()"></div>
                            <div class="field"><label>📅 Au</label><input type="date" id="${cfg.prefix}To" value="${to}" onchange="${cfg.name}.show()"></div>
                        </div>
                        <div class="field"><label>Choisir</label>
                            <select id="${cfg.prefix}Select" onchange="${cfg.name}.show()">
                                <option value="">-- Choisir --</option>
                                ${cfg.list().map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}
                            </select>
                        </div>
                        <div id="${cfg.prefix}Result"></div>
                    `;
                    setTimeout(() => this.show(), 100);
                },
                show() {
                    const select = $(`${cfg.prefix}Select`);
                    const result = $(`${cfg.prefix}Result`);
                    if (!select || !result) return;
                    const id = parseInt(select.value);
                    if (!id) { result.innerHTML = '<div class="empty-msg">Choisissez</div>'; return; }
                    this.currentId = id;
                    const entity = cfg.list().find(x => x.id === id);
                    if (!entity) { result.innerHTML = '<div class="empty-msg">Introuvable</div>'; return; }
                    BalanceCalculator.recalculate(cfg.balanceType, entity.name);
                    const from = new Date($(`${cfg.prefix}From`).value);
                    const to = new Date($(`${cfg.prefix}To`).value);
                    to.setHours(23, 59, 59);
                    const docs = cfg.docs()
                        .filter(d => d[cfg.docKey] === entity.name)
                        .filter(d => { const dt = new Date(d.date); return dt >= from && dt <= to; })
                        .sort((a, b) => a.date < b.date ? -1 : 1);
                    const payments = cfg.caisse().filter(p => p[cfg.caisseKey] === entity.name);
                    let allMovements = [];
                    docs.forEach(d => {
                        const dp = payments.filter(p => p.invoiceNum === d.num);
                        const paid = dp.reduce((s, p) => s + p.amount, 0);
                        const label = (!d.lines || !d.lines.length) ? '💰 Règlement' : cfg.docLabel;
                        allMovements.push({ date:d.date, doc:d.num, description: label, debit:d.total, credit:paid, type:'doc' });
                    });
                    payments.filter(p => !p.invoiceNum).forEach(p => {
                        allMovements.push({ date:p.date, doc:'', description:'💳 Paiement direct', debit:0, credit:p.amount, type:'payment' });
                    });
                    allMovements.sort((a, b) => a.date < b.date ? -1 : 1);
                    let cumul = entity.openingBalance || 0;
                    const movements = [{ date:'---', doc:'Ouverture', description:"Solde d'ouverture", debit:0, credit:0, balance:cumul }];
                    allMovements.forEach(m => {
                        if (m.type === 'doc') cumul += m.debit - m.credit;
                        else cumul -= m.credit;
                        movements.push({ ...m, balance: cumul });
                    });
                    const totalInvoices = docs.length;
                    const totalPurchases = docs.reduce((s, d) => s + d.total, 0);
                    const totalPaid = payments.reduce((s, p) => s + p.amount, 0);
                    const curBalance = entity.balance || 0;
                    let html = this.buildSummaryCard(entity, totalInvoices, totalPurchases, totalPaid, curBalance);
                    html += this.buildBalanceDisplay(entity.openingBalance || 0, curBalance);
                    html += this.buildActions(entity);
                    html += this.buildInvoicesTable(docs, payments);
                    html += this.buildMovementsTable(movements);
                    result.innerHTML = html;
                },
                openInvoice(num) {
                    if (!num) return;
                    const inv = cfg.docs().find(d => d.num === num);
                    if (!inv) { Toast.show('❌ Facture introuvable', 'error'); return; }
                    const module = cfg.invoiceModule();
                    if (!module || !module.load) return;
                    module.load(inv.id);
                },
                buildSummaryCard(e, ti, tp, tpay, cb) {
                    const loginLine = e.login ? `<div><span class="label">🔑 Login:</span><span class="value" style="font-family:monospace;">${esc(e.login)}</span></div>` : '';
                    return `<div class="client-summary-card"><div class="grid">
                        <div><span class="label">👤 ${esc(cfg.entityLabel)}:</span><span class="value">${esc(e.name)}</span></div>
                        ${loginLine}
                        <div><span class="label">📞 Tél:</span><span class="value">${esc(e.phone || '-')}</span></div>
                        <div><span class="label">📄 Nb factures:</span><span class="value">${ti}</span></div>
                        <div><span class="label">💰 Total:</span><span class="value positive">${Utils.formatNum(tp)} TND</span></div>
                        <div><span class="label">💳 Règlements:</span><span class="value">${Utils.formatNum(tpay)} TND</span></div>
                        <div><span class="label">📊 Solde:</span><span class="value ${cb >= 0 ? 'positive' : 'negative'}">${Utils.formatNum(cb)} TND</span></div>
                    </div></div>`;
                },
                buildBalanceDisplay(op, cl) {
                    return `<div class="balance-display">
                        <div class="item"><span class="label">Ouverture</span><span class="value opening">${Utils.formatNum(op)} TND</span></div>
                        <div class="item"><span class="label">Final</span><span class="value closing">${Utils.formatNum(cl)} TND</span></div>
                    </div>`;
                },
                buildActions(e) {
                    const safeName = Utils.escapeAttr(e.name);
                    return `<div style="display:flex;gap:6px;margin:6px 0;flex-wrap:wrap;">
                        <button class="btn print small" onclick="printStatement('${cfg.statementType}', ${e.id})" style="flex:1;padding:6px;font-size:10px;">🖨️ Imprimer</button>
                        <button class="btn save small" onclick="BalanceCalculator.recalculate('${cfg.balanceType}', '${safeName}'); ${cfg.name}.show();" style="flex:1;padding:6px;font-size:10px;">🔄 Actualiser</button>
                    </div>`;
                },
                buildInvoicesTable(docs, payments) {
                    let rows = '';
                    if (!docs.length) {
                        rows = `<tr><td colspan="7" style="text-align:center;padding:12px;color:var(--muted);">📭 Aucune facture</td></tr>`;
                    } else {
                        docs.forEach(d => {
                            const dp = payments.filter(p => p.invoiceNum === d.num);
                            const paid = dp.reduce((s, p) => s + p.amount, 0);
                            const rem = d.total - paid;
                            const isPaymentOnly = !d.lines || !d.lines.length;
                            let st, sc;
                            if (isPaymentOnly) { st = '💰 Règlement'; sc = '#3498db'; }
                            else if (rem > d.total * 0.9) { st = '⏳ Non payée'; sc = 'var(--danger)'; }
                            else if (rem > 0.001) { st = '🔄 Partielle'; sc = 'var(--warning)'; }
                            else { st = '✅ Payée'; sc = 'var(--success)'; }
                            const safeNum = Utils.escapeAttr(d.num);
                            rows += `<tr>
                                <td style="text-align:left;padding-left:8px;">
                                    <span class="invoice-num-link" onclick="${cfg.name}.openInvoice('${safeNum}')">${esc(d.num)}</span>
                                    <button class="btn-invoice-view" onclick="${cfg.name}.openInvoice('${safeNum}')">📄</button>
                                </td>
                                <td>${esc(Utils.formatDate(d.date))}</td>
                                <td>${Utils.formatNum(d.total)}</td>
                                <td style="color:var(--success);">${Utils.formatNum(paid)}</td>
                                <td style="color:${rem > 0.001 ? 'var(--danger)' : 'var(--success)'};">${Utils.formatNum(rem)}</td>
                                <td style="color:${sc};font-weight:700;">${st}</td>
                                <td>
                                    <button class="btn edit small" onclick="${cfg.name}.editInvoice('${d.id}')" style="padding:1px 6px;font-size:7px;margin:0 1px;">✏️</button>
                                    <button class="btn save small" onclick="${cfg.name}.payInvoice('${d.id}')" style="padding:1px 6px;font-size:7px;margin:0 1px;">💰</button>
                                </td></tr>`;
                        });
                    }
                    return `<div class="section-title" style="margin-top:10px;">📋 Liste des factures</div>
                        <div class="history-table-wrapper"><table class="history-table" style="min-width:700px;">
                            <thead><tr><th>N° Facture</th><th>Date</th><th>Montant</th><th>Payé</th><th>Reste</th><th>Statut</th><th>Actions</th></tr></thead>
                            <tbody>${rows}</tbody></table></div>`;
                },
                buildMovementsTable(movements) {
                    let rows = movements.map(m => {
                        const isInvoice = m.doc && m.doc !== 'Ouverture' && m.doc !== '' &&
                                         (m.doc.startsWith('VTE-') || m.doc.startsWith('ACH-'));
                        const safeDoc = Utils.escapeAttr(m.doc || '');
                        const docCell = isInvoice
                            ? `<td style="font-weight:700;">
                                   <span class="invoice-num-link" onclick="${cfg.name}.openInvoice('${safeDoc}')">${esc(m.doc)}</span>
                                   <button class="btn-invoice-view" onclick="${cfg.name}.openInvoice('${safeDoc}')">📄</button>
                               </td>`
                            : `<td style="font-weight:700;">${esc(m.doc || '-')}</td>`;
                        return `<tr>
                            <td>${esc(m.date)}</td>${docCell}
                            <td>${esc(m.description)}</td>
                            <td style="text-align:right;">${(m.debit || 0).toFixed(3)}</td>
                            <td style="color:var(--success);text-align:right;">${(m.credit || 0).toFixed(3)}</td>
                            <td style="font-weight:800;text-align:right;">${m.balance.toFixed(3)}</td>
                        </tr>`;
                    }).join('');
                    return `<div class="section-title" style="margin-top:10px;">📊 Détail des mouvements</div>
                        <div class="history-table-wrapper"><table class="history-table" style="min-width:650px;">
                            <thead><tr><th>Date</th><th>N°</th><th>Libellé</th><th>Débit</th><th>Crédit</th><th>Solde</th></tr></thead>
                            <tbody>${rows}</tbody></table></div>`;
                },
                editInvoice(id) {
                    const inv = cfg.docs().find(d => d.id === id);
                    if (!inv) return;
                    cfg.invoiceModule().load(inv.id);
                },
                payInvoice(id) {
                    const inv = cfg.docs().find(d => d.id === id);
                    if (!inv) return;
                    cfg.invoiceModule().load(inv.id);
                    setTimeout(() => {
                        const el = $(cfg.regAmount);
                        if (el) { el.focus(); el.select(); }
                    }, 500);
                }
            };
        }

        const ClientHistory = createHistoryModule({
            name:'ClientHistory', container:'clientHistoryContent', prefix:'clientHistory',
            statementType:'client', entityLabel:'Client', balanceType:'client',
            docKey:'client', docLabel:'Facture', caisseKey:'clientName',
            invoiceModule:() => VentesModule, regAmount:'vRegAmount',
            list:() => State.clients, docs:() => State.ventes, caisse:() => State.caisseClients
        });

        const FournisseurHistory = createHistoryModule({
            name:'FournisseurHistory', container:'fournisseurHistoryContent', prefix:'fournisseurHistory',
            statementType:'fournisseur', entityLabel:'Fournisseur', balanceType:'supplier',
            docKey:'supplier', docLabel:'Facture d\'achat', caisseKey:'fournisseurName',
            invoiceModule:() => AchatsModule, regAmount:'pRegAmount',
            list:() => State.fournisseurs, docs:() => State.achats, caisse:() => State.caisseFournisseurs
        });

        const ArticleHistory = {
            render() {
                const container = $('articleHistoryContent');
                if (!container) return;
                container.innerHTML = `
                    <div class="field-row-2">
                        <div class="field"><label>📅 Du</label><input type="date" id="articleHistoryFrom" value="${Utils.monthStart()}" onchange="ArticleHistory.show()"></div>
                        <div class="field"><label>📅 Au</label><input type="date" id="articleHistoryTo" value="${Utils.today()}" onchange="ArticleHistory.show()"></div>
                    </div>
                    <div class="field"><label>Choisir</label>
                        <select id="articleHistorySelect" onchange="ArticleHistory.show()">
                            <option value="">-- Choisir --</option>
                            ${State.articles.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}
                        </select>
                    </div>
                    <div id="articleHistoryResult"></div>
                `;
                setTimeout(() => this.show(), 100);
            },
            show() {
                const select = $('articleHistorySelect');
                const result = $('articleHistoryResult');
                if (!select || !result) return;
                const id = parseInt(select.value);
                if (!id) { result.innerHTML = '<div class="empty-msg">Choisissez</div>'; return; }
                const article = State.articles.find(a => a.id === id);
                if (!article) return;
                const from = new Date($('articleHistoryFrom').value);
                const to = new Date($('articleHistoryTo').value);
                to.setHours(23, 59, 59);
                const movements = [];
                State.ventes.forEach(v => {
                    const dt = new Date(v.date);
                    if (dt < from || dt > to) return;
                    v.lines.forEach(l => {
                        if (l.name === article.name) movements.push({ date:v.date, doc:v.num, type:'vente', party:v.client, qty:-l.qty, price:l.price, total:l.total });
                    });
                });
                State.achats.forEach(a => {
                    const dt = new Date(a.date);
                    if (dt < from || dt > to) return;
                    a.lines.forEach(l => {
                        if (l.name === article.name) movements.push({ date:a.date, doc:a.num, type:'achat', party:a.supplier, qty:l.qty, price:l.price, total:l.total });
                    });
                });
                movements.sort((a, b) => a.date < b.date ? -1 : 1);
                const stockDepart = article.stockDepart !== undefined ? article.stockDepart : (article.stock || 0);
                let html = `<div class="client-summary-card"><div class="grid">
                    <div><span class="label">📦 Article:</span><span class="value">${esc(article.name)}</span></div>
                    <div><span class="label">📊 Stock:</span><span class="value">${article.stock || 0}</span></div>
                </div></div>
                <div style="display:flex;gap:6px;margin:6px 0;">
                    <button class="btn print small" onclick="printStatement('article', ${article.id})" style="flex:1;padding:6px;font-size:10px;">🖨️ Imprimer</button>
                </div>
                <div class="history-table-wrapper"><table class="history-table" style="min-width:650px;">
                    <thead><tr><th>Date</th><th>Doc</th><th>Type</th><th>Tiers</th><th>Qté</th><th>Prix</th><th>Total</th><th>Solde</th></tr></thead>
                    <tbody>`;
                if (!movements.length) {
                    html += `<tr><td colspan="8" style="text-align:center;padding:12px;color:var(--muted);">📭 Aucun mouvement</td></tr>`;
                } else {
                    let cumul = stockDepart;
                    html += `<tr style="background:#f0f4ff;"><td>---</td><td>---</td><td style="font-weight:700;">Stock initial</td><td>-</td><td style="font-weight:700;">${cumul}</td><td>-</td><td>-</td><td style="font-weight:800;">${cumul}</td></tr>`;
                    movements.forEach(m => {
                        cumul += m.qty;
                        const tl = m.type === 'vente' ? '📤 Vente' : '📥 Achat';
                        const qd = m.qty > 0 ? '+' + m.qty : m.qty;
                        const color = m.qty > 0 ? 'var(--success)' : 'var(--danger)';
                        const isInvoice = m.doc && (m.doc.startsWith('VTE-') || m.doc.startsWith('ACH-'));
                        const safeDoc = Utils.escapeAttr(m.doc);
                        const docCell = isInvoice
                            ? `<td style="font-weight:700;">
                                   <span class="invoice-num-link" onclick="ArticleHistory.openInvoice('${safeDoc}', '${m.type}')">${esc(m.doc)}</span>
                                   <button class="btn-invoice-view" onclick="ArticleHistory.openInvoice('${safeDoc}', '${m.type}')">📄</button>
                               </td>`
                            : `<td style="font-weight:700;">${esc(m.doc)}</td>`;
                        html += `<tr>
                            <td>${esc(Utils.formatDate(m.date))}</td>${docCell}

                const from = $('reportDateFrom')?.value || '';
                const to = $('reportDateTo')?.value || '';
                const config = {
                    sales: { data: () => this.getSalesData(from, to), headers: ['Date','Client','N° facture','Montant','Payé','Reste','Statut'], title: 'Rapport des ventes' },
                    purchases: { data: () => this.getPurchasesData(from, to), headers: ['Date','Fournisseur','N° facture','Montant','Payé','Reste'], title: 'Rapport des achats' },
                    profit: { data: () => this.getProfitData(from, to), headers: ['Période','Ventes','Achats','Dépenses','Bénéfice brut','Bénéfice net'], title: 'Profits et pertes' },
                    clients: { data: () => this.getClientsData(from, to), headers: ['Login','Client','Nb factures','Total achats','Payé','Solde'], title: 'Rapport des clients' },
                    products: { data: () => this.getProductsData(from, to), headers: ['Produit','Qté vendue','Total ventes','Prix moyen','Stock actuel'], title: 'Rapport des produits' },
                    inventory: { data: () => this.getInventoryData(), headers: ['Produit','Stock','Stock min','Valeur','Statut'], title: 'Inventaire' },
                    cash: { data: () => this.getCashData(from, to), headers: ['Date','Description','Type','Montant','Solde cumulé'], title: 'Trésorerie' },
                    expenses: { data: () => this.getExpensesData(from, to), headers: ['Date','Catégorie','Description','Montant'], title: 'Rapport des dépenses' }
                };
                const c = config[type];
                if (!c) return;
                const data = c.data();
                this.renderReport(data, c.headers, c.title);
                this.updateKPIs(data, type);
            },
            getSalesData(from, to) {
                let list = [...State.ventes];
                if (from && to) list = list.filter(v => v.date >= from && v.date <= to);
                return list.map(v => {
                    const paid = (v.reglements || []).reduce((s, r) => s + r.amount, 0);
                    const rem = v.total - paid;
                    const isPaymentOnly = !v.lines || !v.lines.length;
                    let st;
                    if (isPaymentOnly) st = '💰 Règlement';
                    else if (rem <= 0) st = '✅ Payée';
                    else if (rem >= v.total) st = '⏳ Non payée';
                    else st = '🔄 Partielle';
                    return { date: v.date, client: v.client, num: v.num, total: v.total, paid, remaining: rem, status: st };
                });
            },
            getPurchasesData(from, to) {
                let list = [...State.achats];
                if (from && to) list = list.filter(v => v.date >= from && v.date <= to);
                return list.map(v => {
                    const paid = (v.reglements || []).reduce((s, r) => s + r.amount, 0);
                    return { date: v.date, supplier: v.supplier, num: v.num, total: v.total, paid, remaining: v.total - paid };
                });
            },
            getProfitData(from, to) {
                const v = State.ventes.filter(x => x.date >= from && x.date <= to);
                const a = State.achats.filter(x => x.date >= from && x.date <= to);
                const e = State.expenses.filter(x => x.date >= from && x.date <= to);
                const ts = v.reduce((s, x) => s + x.total, 0);
                const tp = a.reduce((s, x) => s + x.total, 0);
                const te = e.reduce((s, x) => s + x.amount, 0);
                return [{ period: `${from} - ${to}`, totalSales: ts, totalPurchases: tp, totalExpenses: te, grossProfit: ts - tp, netProfit: ts - tp - te }];
            },
            getClientsData(from, to) {
                return State.clients.map(c => {
                    const cv = State.ventes.filter(v => v.client === c.name && (!from || v.date >= from) && (!to || v.date <= to));
                    const total = cv.reduce((s, v) => s + v.total, 0);
                    const paid = cv.reduce((s, v) => s + (v.reglements || []).reduce((a, r) => a + r.amount, 0), 0);
                    return { login: c.login || '-', name: c.name, invoices: cv.length, totalPurchases: total, paid, balance: c.balance || 0 };
                });
            },
            getProductsData(from, to) {
                return State.articles.map(a => {
                    let q = 0, s = 0;
                    State.ventes.forEach(v => {
                        if (from && v.date < from) return;
                        if (to && v.date > to) return;
                        if (!v.lines) return;
                        v.lines.forEach(l => {
                            if (l.name === a.name) { q += l.qty; s += l.total; }
                        });
                    });
                    return { name: a.name, quantity: q, totalSales: s, avgPrice: q > 0 ? s / q : 0, stock: a.stock || 0 };
                });
            },
            getInventoryData() {
                return State.articles.map(a => {
                    const st = a.stock || 0, min = a.minStock || 5;
                    const val = st * (a.costPrice || a.price || 0);
                    let status = '🟢 Bon';
                    if (st <= 0) status = '🔴 Épuisé';
                    else if (st < min) status = '🟡 Faible';
                    else if (st < min * 2) status = '🟠 Moyen';
                    return { name: a.name, stock: st, minStock: min, value: val, status };
                });
            },
            getCashData(from, to) {
                const m = [];
                State.caisseClients.forEach(c => {
                    if ((!from || c.date >= from) && (!to || c.date <= to)) m.push({ date: c.date, description: `Client ${c.clientName}`, type: 'Entrée', amount: c.amount });
                });
                State.caisseFournisseurs.forEach(c => {
                    if ((!from || c.date >= from) && (!to || c.date <= to)) m.push({ date: c.date, description: `Fournisseur ${c.fournisseurName}`, type: 'Sortie', amount: -c.amount });
                });
                m.sort((a, b) => a.date < b.date ? -1 : 1);
                let cum = State.companyInfo.cashOpening || 0;
                return m.map(x => { cum += x.amount; return { ...x, amount: Math.abs(x.amount), balance: cum }; });
            },
            getExpensesData(from, to) {
                let list = [...State.expenses];
                if (from && to) list = list.filter(e => e.date >= from && e.date <= to);
                return list;
            },
            renderReport(data, headers, title) {
                const th = $('reportTableHead');
                const tb = $('reportTableBody');
                if (!th || !tb) return;
                const te = document.querySelector('#sec-reports .section-title');
                if (te) te.textContent = `📊 ${title}`;
                th.innerHTML = `<tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr>`;
                if (!data.length) {
                    tb.innerHTML = `<tr><td colspan="${headers.length}" style="text-align:center;padding:20px;color:#999;">Aucune donnée</td></tr>`;
                    return;
                }
                tb.innerHTML = data.map(item => {
                    const vals = Object.values(item);
                    return `<tr>${vals.map((v, idx) => {
                        if (typeof v === 'number') return `<td style="text-align:right;">${v.toFixed(3)}</td>`;
                        if (idx === 2 && typeof v === 'string' && (v.startsWith('VTE-') || v.startsWith('ACH-'))) {
                            const safeNum = Utils.escapeAttr(v);
                            return `<td>
                                <span class="invoice-num-link" onclick="AdvancedReports.openInvoice('${safeNum}')">${esc(v)}</span>
                                <button class="btn-invoice-view" onclick="AdvancedReports.openInvoice('${safeNum}')">📄</button>
                            </td>`;
                        }
                        return `<td>${esc(v)}</td>`;
                    }).join('')}</tr>`;

            openInvoice(num) {
                if (!num) return;
                const vente = State.ventes.find(d => d.num === num);
                if (vente) { VentesModule.load(vente.id); return; }
                const achat = State.achats.find(d => d.num === num);
                if (achat) { AchatsModule.load(achat.id); return; }
                Toast.show('❌ Introuvable', 'error');
            },
            updateKPIs(data, type) {
                let ts = 0, tp = 0, tpr = 0, np = 0;
                if (type === 'sales') {
                    ts = data.reduce((s, x) => s + (x.total || 0), 0);
                    const paid = data.reduce((s, x) => s + (x.paid || 0), 0);
                    tpr = ts - paid;
                } else if (type === 'purchases') { tp = data.reduce((s, x) => s + (x.total || 0), 0); }
                else if (type === 'profit') {
                    const d = data[0] || {};
                    ts = d.totalSales || 0; tp = d.totalPurchases || 0;
                    tpr = d.grossProfit || 0; np = d.netProfit || 0;
                } else if (type === 'clients') { ts = data.reduce((s, x) => s + (x.totalPurchases || 0), 0); }
                else if (type === 'products') { ts = data.reduce((s, x) => s + (x.totalSales || 0), 0); }
                const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
                set('reportTotalSales', ts.toFixed(3));
                set('reportTotalPurchases', tp.toFixed(3));
                set('reportGrossProfit', tpr.toFixed(3));
                set('reportNetProfit', np.toFixed(3));
                set('reportTotalClients', State.clients.length);
                set('reportTotalProducts', State.articles.length);
            },
            printReport() {
                const content = $('reportTableWrapper')?.innerHTML || '';
                const title = document.querySelector('#sec-reports .section-title')?.textContent || 'Rapport';
                const kpis = $('reportsKPIs')?.innerHTML || '';
                PrintSystem.openPrintWindow(title, `<div class="kpi-row">${kpis}</div>${content}`);
            },
            exportCSV() {
                const rows = document.querySelectorAll('#reportTableBody tr');
                if (!rows.length) { Toast.show('Aucune donnée'); return; }
                const headers = [...document.querySelectorAll('#reportTableHead th')].map(th => th.textContent);
                let csv = headers.join(',') + '\n';
                rows.forEach(r => {
                    const c = [...r.querySelectorAll('td')].map(td => `"${td.textContent.trim().replace(/"/g, '""')}"`);
                    csv += c.join(',') + '\n';
                });
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `Rapport_${Utils.today()}.csv`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
                Toast.show('✅ Exporté', 'success');
            }
        };

        const Fullscreen = {
            isActive() {
                return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                          document.mozFullScreenElement || document.msFullscreenElement);
            },
            async enter() {
                const el = document.documentElement;
                try {
                    if (el.requestFullscreen) await el.requestFullscreen();
                    else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
                    else if (el.mozRequestFullScreen) await el.mozRequestFullScreen();
                    else if (el.msRequestFullscreen) await el.msRequestFullscreen();
                    this.updateButton();
                    Toast.show('⛶ Plein écran activé', 'success');
                } catch(err) { Toast.show('⚠️ Non supporté', 'warning'); }
            },
            async exit() {
                try {
                    if (document.exitFullscreen) await document.exitFullscreen();
                    else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
                    else if (document.mozCancelFullScreen) await document.mozCancelFullScreen();
                    else if (document.msExitFullscreen) await document.msExitFullscreen();
                    this.updateButton();
                } catch(err) {}
            },
            toggle() { if (this.isActive()) this.exit(); else this.enter(); },
            updateButton() {
                const btn = $('fullscreenBtn');
                if (!btn) return;
                if (this.isActive()) { btn.textContent = '🗗'; btn.classList.add('active'); }
                else { btn.textContent = '⛶'; btn.classList.remove('active'); }
            },
            init() {
                ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
                    .forEach(evt => document.addEventListener(evt, () => this.updateButton()));
                document.addEventListener('keydown', e => {
                    if (e.key === 'F11') { e.preventDefault(); this.toggle(); }
                });
                this.updateButton();
            }
        };

                        const creds = saved ? JSON.parse(saved) : null;
                        if (creds) {
                            const curHash = await Utils.hashPassword(c, creds.salt);
                            if (!Utils.constantTimeEqual(curHash, creds.hash)) {
                                err.textContent = '❌ Mot de passe actuel incorrect';
                                return;
                            }
                        }
                        const salt = Utils.generateSalt();
                        const hash = await Utils.hashPassword(n, salt);
                        localStorage.setItem(APP_CONFIG.adminCredsKey, JSON.stringify({
                            hash, salt, updatedAt: new Date().toISOString()
                        }));
                        err.textContent = '';
                        $('staffPasswordModal').classList.remove('show');
                        Toast.show('✅ Mot de passe Admin changé', 'success');
                        return;
                    } catch(e) { err.textContent = '❌ Erreur'; return; }
                }
                this.changeStaffPassword();
            },
            async login() {
                const e = $('loginEmail').value.trim();
                const p = $('loginPassword').value;
                if (!e || !p) { $('loginError').textContent = 'Login et mot de passe requis'; return; }
                const rl = LoginThrottle.check(e.toLowerCase());
                if (rl.blocked) {
                    $('loginError').textContent = `🚫 Trop de tentatives. Réessayez dans ${rl.waitMin} min.`;
                    return;
                }
                if (e.toLowerCase() === APP_CONFIG.adminLogin) {
                    const ok = await this.loginAdminLocal(p);
                    if (ok) { LoginThrottle.clear(e.toLowerCase()); return; }
                    LoginThrottle.record(e.toLowerCase());
                    $('loginError').textContent = '❌ Mot de passe admin incorrect';
                    return;
                }
                const clientOk = await this._tryClientLogin();
                if (clientOk) { LoginThrottle.clear(e.toLowerCase()); return; }
                const clientByLogin = State.clients.find(c =>
                    (c.login || '').toLowerCase() === e.toLowerCase()
                );
                if (clientByLogin) {
                    LoginThrottle.record(e.toLowerCase());
                    // ✅ إصلاح: رسالة خطأ واضحة
                    $('loginError').textContent = '❌ Mot de passe incorrect pour ce Login';
                    return;
                }
                $('loginError').textContent = '';
                $('loginLoading').style.display = 'block';
                if (!window.auth) {
                    $('loginError').textContent = '❌ Firebase non disponible';
                    $('loginLoading').style.display = 'none';
                    return;
                }
                if (!e.includes('@')) {
                    $('loginError').textContent = '❌ Login introuvable';
                    $('loginLoading').style.display = 'none';
                    return;
                }
                window.auth.signInWithEmailAndPassword(e, p)
                    .then(() => LoginThrottle.clear(e.toLowerCase()))
                    .catch(err => {
                        LoginThrottle.record(e.toLowerCase());
                        $('loginError').textContent = err.message;
                    })
                    .finally(() => { $('loginLoading').style.display = 'none'; });
            },
            async signup() {
                const e = $('loginEmail').value.trim().toLowerCase();
                const p = $('loginPassword').value;
                if (!e || !p) { $('loginError').textContent = 'Email et mot de passe requis'; return; }
                if (p.length < 8) { $('loginError').textContent = '⚠️ Min 8 caractères'; return; }
                if (e === APP_CONFIG.adminLogin) {
                    $('loginError').textContent = '❌ "admin" réservé';
                    return;
                }
                if (!Utils.isValidEmail(e)) {
                    $('loginError').textContent = '❌ Email valide requis pour Staff';
                    return;
                }
                const existingClient = State.clients.find(c =>
                    (c.email || '').toLowerCase().trim() === e ||
                    (c.login || '').toLowerCase() === e
                );
                if (existingClient) {
                    $('loginError').textContent = '❌ Email réservé au client';
                    return;
                }
                if (typeof firebase === 'undefined' || !window.auth) {
                    $('loginError').textContent = '❌ Firebase requis';
                    return;
                }
                const ok = await CustomConfirm.show(
                    'Créer un compte Staff ?\n\n• Email: ' + e + '\n\n⚠️ Compte à approuver par l\'admin.',
                    '👤 Nouveau Staff'
                );
                if (!ok) return;
                $('loginError').textContent = '⏳ Création...';
                $('loginLoading').style.display = 'block';
                window.auth.createUserWithEmailAndPassword(e, p)
                    .then(async (cred) => {
                        const uid = cred.user.uid;
                        try {
                            if (window.db) {
                                await window.db.collection('approvals').doc(uid).set({
                                    email: e,
                                    requestedAt: new Date().toISOString(),
                                    approved: false,
                                    role: 'staff'
                                });
                            }

                            console.error('❌ Firestore error:', dbErr);

                        $('loginError').textContent = '❌ ' + (err.message || 'Erreur');

                    .finally(() => { $('loginLoading').style.display = 'none'; });

            changePassword() {
                const c = $('currentPassword').value;
                const n = $('newPassword').value;
                const cf = $('confirmPassword').value;
                const err = $('passwordError');
                if (!c || !n || !cf) { err.textContent = '⚠️ Tous les champs requis'; return; }
                if (n.length < 6) { err.textContent = '⚠️ Min 6 caractères'; return; }
                if (n !== cf) { err.textContent = '⚠️ Non concordance'; return; }
                err.textContent = '⏳...';
                const user = window.auth?.currentUser;
                if (!user) return;
                const cred = firebase.auth.EmailAuthProvider.credential(user.email, c);
                user.reauthenticateWithCredential(cred)
                    .then(() => user.updatePassword(n))
                    .then(() => { err.textContent = ''; $('passwordModal').classList.remove('show'); Toast.show('✅ Changé'); })
                    .catch(e => { err.textContent = '❌ ' + e.message; });
            },
            changeStaffPassword() {
                if (State.currentUser && State.currentUser.isLocalAdmin) {
                    this.changeAdminPassword();
                    return;
                }
                const c = $('staffCurrentPassword').value;
                const n = $('staffNewPassword').value;
                const cf = $('staffConfirmPassword').value;
                const err = $('staffPasswordError');
                if (!c || !n || !cf) { err.textContent = '⚠️ Tous les champs requis'; return; }
                if (n.length < 6) { err.textContent = '⚠️ Min 6 caractères'; return; }
                if (n !== cf) { err.textContent = '⚠️ Non concordance'; return; }
                err.textContent = '⏳...';
                const user = window.auth?.currentUser;
                if (user && user.email) {
                    const cred = firebase.auth.EmailAuthProvider.credential(user.email, c);
                    user.reauthenticateWithCredential(cred)
                        .then(() => user.updatePassword(n))
                        .then(() => {
                            err.textContent = '';
                            $('staffPasswordModal').classList.remove('show');
                            Toast.show('✅ Mot de passe changé', 'success');
                            NotificationSystem.add('Mot de passe modifié', 'Votre mot de passe a été changé.', 'SUCCESS');
                        })
                        .catch(e => { err.textContent = '❌ ' + (e.message || 'Erreur'); });
                    return;
                }
                err.textContent = '❌ Aucun utilisateur connecté';
            },
            _watchAuthState() {
                if (!window.auth) return;
                window.auth.onAuthStateChanged(async user => {
                    if (user) {
                        if (State.currentUser && (State.currentUser.isClient || State.currentUser.isLocalAdmin)) return;
                        State.currentUser = user;
                        $('accountEmailDisplay2').textContent = user.email || '';
                        $('accountEmailDisplay').textContent = user.email || '';
                        await Persistence.loadFromCloud(user.uid);
                        const email = (user.email || '').toLowerCase().trim();
                        if (email === APP_CONFIG.adminEmail.toLowerCase()) {
                            State.currentUser.isStaff = false;
                            State.currentUser.isAdmin = true;
                            this._showApp(); return;
                        }
                        const client = State.clients.find(c => (c.email || '').toLowerCase().trim() === email);
                        if (client) {
                            State.currentClient = client;
                            State.currentUser = { login: client.login || '', email, uid: 'client_' + client.id, isClient: true };
                            try {
                                sessionStorage.setItem(APP_CONFIG.sessionKey, JSON.stringify({
                                    clientId: client.id, login: client.login || '', email, expiresAt: Date.now() + 8 * 60 * 60 * 1000
                                }));
                            } catch(e) {}
                            setTimeout(() => ClientPortal.show(), 300);
                            return;
                        }
                        if (window.db) {
                            try {
                                const doc = await window.db.collection('approvals').doc(user.uid).get();
                                if (!doc.exists) {
                                    await window.db.collection('approvals').doc(user.uid).set({
                                        email: user.email || '',
                                        requestedAt: new Date().toISOString(),
                                        approved: false,
                                        role: 'staff'
                                    });
                                    this._showPending();
                                } else if (doc.data().approved === true) {
                                    const approvalData = doc.data();
                                    State.currentUser.isStaff = true;
                                    State.currentUser.approvalRole = approvalData.role || 'staff';
                                    this._showApp();
                                } else this._showPending();
                            } catch(e) { this._showPending(); }
                        } else this._showPending();
                    } else {
                        if (State.currentUser && (State.currentUser.isClient || State.currentUser.isLocalAdmin)) return;
                        State.currentUser = null;
                        State.currentClient = null;
                        $('loginOverlay').classList.remove('hide');
                        $('pendingOverlay').classList.add('hide');
                        $('clientPortal')?.classList.remove('show');
                        document.querySelector('.phone').style.display = 'flex';
                    }
                });
            },
            _showApp() {
                $('loginOverlay').classList.add('hide');
                $('pendingOverlay').classList.add('hide');
                $('clientPortal').classList.remove('show');
                document.querySelector('.phone').style.display = 'flex';
                NotificationSystem.load();
                NotificationSystem.updateBadge();
                App.reloadAll();
                App.showSection('dashboard');
                Dashboard.load();
                Toast.show(`☁️ Connecté (Cloud sécurisé)`, 'success');
                setTimeout(() => {
                    AdvancedReports.generateReport();
                    Marges.init();
                    Marges.render();
                    FinanceJour.init();
                    Dashboard.load();
                }, 800);
            },
            _showPending() {
                $('loginOverlay').classList.add('hide');
                $('pendingOverlay').classList.remove('hide');
                $('clientPortal').classList.remove('show');
                document.querySelector('.phone').style.display = 'flex';
            }
        };

        function downloadTemplate() {
            const headers = ['Login','Nom','Téléphone 1','Téléphone 2','Email','Adresse','MF',"Solde d'ouverture",'Mot de passe'];
            const sample = [
                ['Amine_2026','Amine','12345678','','amine@email.com','Tunis','1234567','0','AZRDG234'],
                ['Salah_01','Salah','23456789','','salah@email.com','Ariana','7654321','1000','K8M2P9X4']
            ];
            const ws = XLSX.utils.aoa_to_sheet([headers, ...sample]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Clients');

        function handleImportFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);
                    if (!json.length) { Toast.show('⚠️ Fichier vide'); return; }
                    importData = json;
                    showImportPreview(json);
                    Toast.show(`✅ ${json.length} trouvés`, 'success');
                } catch(err) { Toast.show('❌ Erreur: ' + err.message, 'error'); }
            };
            reader.readAsArrayBuffer(file);
            input.value = '';
        }

        function showImportPreview(data) {
            const preview = $('importPreview');
            const cb = $('importConfirmBtn');
            const xb = $('importCancelBtn');
            if (!data.length) { preview.style.display = 'none'; cb.style.display = 'none'; xb.style.display = 'none'; return; }
            const existing = State.clients.map(c => (c.login || '').toLowerCase());
            const dups = data.filter(r => r.Login && existing.includes(String(r.Login).toLowerCase()));
            const headers = Object.keys(data[0]);
            const rows = data.slice(0, 20).map(r => {
                const isDup = r.Login && existing.includes(String(r.Login).toLowerCase());
                return `<tr class="${isDup ? 'highlight-duplicate' : ''}">
                    ${headers.map(h => `<td>${esc(r[h] || '')}</td>`).join('')}
                </tr>`;
            }).join('');
            preview.innerHTML = `
                <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:10px;">
                    <span>📊 ${data.length} clients</span>
                    <span style="color:${dups.length ? 'var(--danger)' : 'var(--success)'};">
                        ${dups.length ? `⚠️ ${dups.length} doublon(s) Login` : '✅ OK'}
                    </span>
                </div>
                <table>
                    <thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
                    <tbody>${rows}</tbody>
                </table>`;
            preview.style.display = 'block';
            cb.style.display = 'block';
            xb.style.display = 'block';
        }

        async function confirmImport() {
            if (!importData.length) { Toast.show('⚠️ Aucune donnée'); return; }
            const pd = $('importProgress');
            const pf = $('importProgressFill');
            const st = $('importStatus');
            $('importConfirmBtn').style.display = 'none';
            $('importCancelBtn').style.display = 'none';
            pd.style.display = 'block';
            let imported = 0, errors = 0;
            const total = importData.length;
            const createdClients = [];
            for (let i = 0; i < importData.length; i++) {
                const row = importData[i];
                try {
                    const login = String(row.Login || row.login || '').trim();
                    const name = (row.Nom || row.nom || row.name || '').trim();
                    if (!name || !login) { errors++; continue; }
                    if (!Utils.isValidLogin(login)) { errors++; continue; }
                    if (State.clients.some(c => (c.login || '').toLowerCase() === login.toLowerCase())) { errors++; continue; }
                    if (State.clients.some(c => c.name.toLowerCase() === name.toLowerCase())) { errors++; continue; }
                    const plainPwd = String(row['Mot de passe'] || row.password || '').trim();
                    let passwordHash = null, passwordSalt = null;
                    if (plainPwd && plainPwd.length >= 4) {
                        passwordSalt = Utils.generateSalt();
                        passwordHash = await Utils.hashPassword(plainPwd, passwordSalt);
                    }
                    const newClient = {
                        id: State.nextId.clients++,
                        login,
                        name,
                        phone: String(row['Téléphone 1'] || row['Téléphone'] || '').trim(),
                        phone2: String(row['Téléphone 2'] || '').trim(),
                        email: String(row.Email || row.email || '').trim().toLowerCase(),
                        address: String(row.Adresse || row.adresse || '').trim(),
                        taxId: String(row['Matricule fiscal'] || row['MF'] || '').trim(),
                        openingBalance: parseFloat(row["Solde d'ouverture"] || row.Solde || 0) || 0,
                        balance: parseFloat(row["Solde d'ouverture"] || row.Solde || 0) || 0,
                        passwordHash, passwordSalt,
                        specialPrices: []
                    };
                    State.clients.push(newClient);
                    createdClients.push(newClient);
                    imported++;
                    pf.style.width = ((i + 1) / total * 100) + '%';
                    st.textContent = `${i + 1}/${total}`;
                } catch(err) { errors++; }
            }
            setTimeout(async () => {
                Persistence.save();
                ClientsRenderer.render();
                // ✅ مزامنة كل الحرفاء الجدد مع Firebase
                if (window.db && createdClients.length) {
                    st.textContent = `☁️ Synchronisation...`;
                    for (const c of createdClients) {
                        if (c.passwordHash) await ClientLoginsSync.syncOne(c);
                    }
                }
                pf.style.width = '100%';
                st.textContent = `✅ ${imported} importés, ${errors} erreurs`;
                Toast.show(`✅ ${imported} clients importés`, 'success');
                setTimeout(() => {
                    pd.style.display = 'none';
                    $('importPreview').style.display = 'none';
                    importData = [];
                }, 3000);
            }, 500);
        }
