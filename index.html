        function printStatement(type, id) {
            if (!type || !id) { Toast.show('⚠️ Paramètres invalides', 'warning'); return; }
            const numericId = parseInt(id, 10);
            if (isNaN(numericId)) { Toast.show('⚠️ ID invalide', 'warning'); return; }
            
            if (type === 'client') {
                const c = State.clients.find(x => x.id === numericId);
                if (!c) return;
                BalanceCalculator.recalculateClient(c.name);
                const fromEl = $('clientHistoryFrom');
                const toEl = $('clientHistoryTo');
                const from = fromEl ? new Date(fromEl.value) : new Date(0);
                const to = toEl ? new Date(toEl.value) : new Date();
                to.setHours(23, 59, 59);
                const docs = State.ventes.filter(v => v.client === c.name && new Date(v.date) >= from && new Date(v.date) <= to)
                    .sort((a, b) => a.date < b.date ? -1 : 1);
                const pays = State.caisseClients.filter(p => p.clientName === c.name);
                const pendingOrders = State.orders.filter(o =>
                    (o.clientId === c.id || o.clientName === c.name) &&
                    (o.status === 'pending' || o.status === 'approved')
                );
                showPreviewReleve('client', c, docs, pays, pendingOrders);
            } else if (type === 'fournisseur') {
                const f = State.fournisseurs.find(x => x.id === numericId);
                if (!f) return;
                BalanceCalculator.recalculateSupplier(f.name);
                const fromEl = $('fournisseurHistoryFrom');
                const toEl = $('fournisseurHistoryTo');
                const from = fromEl ? new Date(fromEl.value) : new Date(0);
                const to = toEl ? new Date(toEl.value) : new Date();
                to.setHours(23, 59, 59);
                const docs = State.achats.filter(a => a.supplier === f.name && new Date(a.date) >= from && new Date(a.date) <= to)
                    .sort((a, b) => a.date < b.date ? -1 : 1);
                const pays = State.caisseFournisseurs.filter(p => p.fournisseurName === f.name);
                showPreviewReleve('fournisseur', f, docs, pays);
            } else if (type === 'article') {
                const a = State.articles.find(x => x.id === numericId);
                if (!a) return;
                showPreviewArticle(a);
            }
        }

        function showPreviewReleve(type, entity, docs, payments, pendingOrders) {
            pendingOrders = pendingOrders || [];
            const isClient = type === 'client';
            const title = isClient ? 'Relevé de compte client' : 'Relevé de compte fournisseur';
            const partyLabel = isClient ? 'Client' : 'Fournisseur';
            const docLabel = isClient ? 'Facture' : "Facture d'achat";
            let cumulative = entity.openingBalance || 0;
            let movements = [{ date:'---', doc:'Ouverture', description:"Solde d'ouverture", debit:0, credit:0, balance:cumulative }];
            const all = [];
            docs.forEach(d => {
                const dp = payments.filter(p => p.invoiceNum === d.num);
                const paid = dp.reduce((s, p) => s + p.amount, 0);
                const label = (!d.lines || !d.lines.length) ? '💰 Règlement' : docLabel;
                all.push({ date:d.date, doc:d.num, description:label, debit:d.total, credit:paid, type:'doc' });
            });
            payments.filter(p => !p.invoiceNum).forEach(p => {
                all.push({ date:p.date, doc:'', description:'💳 Paiement direct', debit:0, credit:p.amount, type:'payment' });
            });
            all.sort((a, b) => a.date < b.date ? -1 : 1);
            all.forEach(m => {
                if (m.type === 'doc') cumulative += m.debit - m.credit;
                else cumulative -= m.credit;
                movements.push({ ...m, balance: cumulative });
            });
            const totalDebit = movements.reduce((s, m) => s + (m.debit || 0), 0);
            const totalCredit = movements.reduce((s, m) => s + (m.credit || 0), 0);
            const finalBalance = entity.balance || cumulative;
            PreviewModal.showStatement(type, {
                title, partyLabel, entity, movements,
                totals: { debit: totalDebit, credit: totalCredit },
                finalBalance,
                pendingOrders
            });
        }

        function showPreviewArticle(article) {
            const fromEl = $('articleHistoryFrom');
            const toEl = $('articleHistoryTo');
            const from = fromEl ? new Date(fromEl.value) : new Date(0);
            const to = toEl ? new Date(toEl.value) : new Date();
            to.setHours(23, 59, 59);
            const movements = [];
            State.ventes.forEach(v => {
                const dt = new Date(v.date);
                if (dt < from || dt > to) return;
                v.lines.forEach(l => {
                    if (l.name === article.name) movements.push({ date:v.date, doc:v.num, type:'vente', party:v.client, qty:-l.qty, price:l.price, total:l.total });
                });
            });
            State.achats.forEach(a => {
                const dt = new Date(a.date);
                if (dt < from || dt > to) return;
                a.lines.forEach(l => {
                    if (l.name === article.name) movements.push({ date:a.date, doc:a.num, type:'achat', party:a.supplier, qty:l.qty, price:l.price, total:l.total });
                });
            });
            movements.sort((a, b) => a.date < b.date ? -1 : 1);
            const stockDepart = article.stockDepart !== undefined ? article.stockDepart : (article.stock || 0);
            let cumul = stockDepart;
            let rows = `<tr style="background:#f0f4ff;">
                <td>---</td><td>---</td><td>Stock initial</td><td>-</td>
                <td>${cumul}</td><td>-</td><td>-</td><td>${cumul}</td>
            </tr>`;
            movements.forEach(m => {
                cumul += m.qty;
                const tl = m.type === 'vente' ? '📤 Vente' : '📥 Achat';
                const qd = m.qty > 0 ? '+' + m.qty : m.qty;
                const color = m.qty > 0 ? '#27ae60' : '#c0392b';
                rows += `<tr>
                    <td>${esc(m.date)}</td><td style="font-weight:700;">${esc(m.doc)}</td>
                    <td>${tl}</td><td>${esc(m.party)}</td>
                    <td style="color:${color};font-weight:700;">${qd}</td>
                    <td>${m.price.toFixed(3)}</td><td>${m.total.toFixed(3)}</td>
                    <td style="font-weight:700;">${cumul}</td>
                </tr>`;
            });
            PreviewModal.showStatement('article', { title: 'Historique - ' + article.name, article, rows });
        }

        function bindEvents() {
            $('overlay')?.addEventListener('click', () => App.closeSheet());
            $('fabBtn')?.addEventListener('click', () => App.onFabClick());
            $('langBtn')?.addEventListener('click', () => Toast.show('🇫🇷 Français'));
            $('paperSizeSelect')?.addEventListener('change', function() {
                if (PrintSystem._currentData) {
                    $('printDoc').className = 'invoice-doc paper-' + this.value;
                }
            });
            document.querySelectorAll('.dash-item').forEach(item => {
                item.addEventListener('click', function() {
                    const id = this.dataset.section;
                    const isAdmin = State.currentUser &&
                        (State.currentUser.isLocalAdmin ||
                         State.currentUser.email === APP_CONFIG.adminEmail ||
                         State.currentUser.email === APP_CONFIG.adminLogin);
                    if (id === 'accounts' && !isAdmin) {
                        Toast.show('⛔ Réservé à l\'admin'); return;
                    }
                    if (id === 'clients-logins' && !isAdmin) {
                        Toast.show('⛔ Réservé à l\'admin'); return;
                    }
                    App.showSection(id);
                });
            });
            // مزامنة Login عند الكتابة في حقل الـ Login
            const cLoginInput = $('cLogin');
            if (cLoginInput) {
                cLoginInput.addEventListener('input', function() {
                    if ($('cDisplayLogin')) $('cDisplayLogin').textContent = this.value.trim() || '-';
                });
            }
            document.addEventListener('keydown', e => {
                if (e.key === 'F1') { e.preventDefault(); showShortcutHelp(); }
                if (e.ctrlKey && e.key === 'p') {
                    e.preventDefault();
                    if ($('sheet-ventes').classList.contains('show') && VentesModule.editingId) {
                        VentesModule.printInvoice();
                    } else if ($('sheet-achats').classList.contains('show') && AchatsModule.editingId) {
                        AchatsModule.printInvoice();
                    } else {
                        Toast.show('⚠️ Aucune facture ouverte');
                    }
                }
                if (e.ctrlKey && e.key === 'n') {
                    e.preventDefault();
                    VentesModule.reset();
                    App.openSheet('ventes');
                }
                if (e.ctrlKey && e.key === 'f') {
                    e.preventDefault();
                    const search = document.querySelector('.section.active .search-box');
                    if (search) { search.focus(); search.select(); }
                }
                if (e.key === 'Escape') {
                    if ($('shortcutHelp').classList.contains('show')) closeShortcutHelp();
                    if ($('notificationPanel').classList.contains('show')) closeNotificationPanel();
                    if ($('previewModal').classList.contains('show')) PreviewModal.close();
                    if ($('customConfirmModal').classList.contains('show')) CustomConfirm.handle(false);
                }
            });
            const dz = $('fileDropZone');
            if (dz) {
                ['dragover','dragleave','drop'].forEach(evt => {
                    dz.addEventListener(evt, e => {
                        e.preventDefault();
                        dz.classList.toggle('dragover', evt === 'dragover');
                        if (evt === 'drop' && e.dataTransfer.files.length) {
                            $('importFileInput').files = e.dataTransfer.files;
                            handleImportFile($('importFileInput'));
                        }
                    });
                });
            }
        }

        Object.assign(window, {
            ClientsModule, FournisseursModule, ArticlesModule, VentesModule, AchatsModule,
            Expenses, Orders, ClientOrder, ClientHistory, FournisseurHistory, ArticleHistory,
            CaisseHistory, FinanceJour, Marges, AdvancedReports, Accounts, CompanyInfo,
            Auth, App, Theme, PrintSystem, PreviewModal, CustomConfirm, NotificationSystem,
            Dashboard, Fullscreen, Persistence, BalanceCalculator, ClientLogins, ClientLoginsSync,
            ClientsRenderer, FournisseursRenderer, ArticlesRenderer, VentesRenderer, AchatsRenderer,
            RoleManager, ClientPortal, Toast, Utils,
            downloadTemplate, handleImportFile, confirmImport, cancelImport,
            showNotificationPanel, closeNotificationPanel,
            openChangePasswordModal, closeChangePasswordModal,
            openStaffPasswordModal, closeStaffPasswordModal,
            showShortcutHelp, closeShortcutHelp, printStatement
        });

        async function migratePasswords() {
            let migrated = 0;
            for (const c of State.clients) {
                if (c.password && !c.passwordHash) {
                    c.passwordSalt = Utils.generateSalt();
                    c.passwordHash = await Utils.hashPassword(c.password, c.passwordSalt);
                    delete c.password;
                    migrated++;
                }
                if (c.passwordHash && c.password) delete c.password;
            }
            for (const f of State.fournisseurs) {
                if (f.passwordHash && f.password) delete f.password;
            }
            if (migrated > 0) {
                Persistence.save();
                console.log(`🔐 ${migrated} mot(s) de passe migré(s)`);
                Toast.show(`🔐 ${migrated} mot(s) de passe migré(s)`, 'success');
            }
        }

        async function migrateClientLogins() {
            let migrated = 0;
            for (const c of State.clients) {
                if (!c.login) {
                    let base = (c.name || 'client')
                        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                        .replace(/[^a-zA-Z0-9]/g, '_')
                        .replace(/_+/g, '_')
                        .replace(/^_+|_+$/g, '')
                        .slice(0, 15) || 'client';
                    let login = base + '_' + c.id;
                    let attempt = 0;
                    while (State.clients.some(x => x.id !== c.id && (x.login || '').toLowerCase() === login.toLowerCase()) && attempt < 50) {
                        login = base + '_' + c.id + '_' + Math.floor(Math.random() * 1000);
                        attempt++;
                    }
                    c.login = login;
                    migrated++;
                }
            }
            if (migrated > 0) {
                Persistence.save();
                console.log(`🔑 ${migrated} client(s) migré(s) avec Login auto`);
                Toast.show(`🔑 ${migrated} client(s) ont reçu un Login auto`, 'success');
            }
        }

        async function repairOldOrders() {
            const brokenOrders = State.orders.filter(o =>
                !o.num || o.num === 'CMD-0NaN' || o.num.includes('NaN')
            );
            if (!brokenOrders.length) return 0;
            brokenOrders.sort((a, b) => {
                const dateA = a.createdAt || a.date + ' ' + (a.time || '00:00:00');
                const dateB = b.createdAt || b.date + ' ' + (b.time || '00:00:00');
                return dateA < dateB ? -1 : 1;
            });
            let maxId = 0;
            State.orders.forEach(o => {
                if (o.id && typeof o.id === 'number' && o.id > maxId) maxId = o.id;
                if (o.num && o.num.startsWith('CMD-') && !o.num.includes('NaN')) {
                    const numPart = parseInt(o.num.replace('CMD-', ''));
                    if (!isNaN(numPart) && numPart > maxId) maxId = numPart;
                }
            });
            let nextNum = maxId + 1;
            let repaired = 0;
            for (const order of brokenOrders) {
                const newNum = 'CMD-' + String(nextNum).padStart(4, '0');
                order.num = newNum;
                order.id = nextNum;
                order.repairedAt = new Date().toISOString();
                if (typeof firebase !== 'undefined' && order.cloudId) {
                    try {
                        await firebase.firestore().collection('orders').doc(order.cloudId).update({
                            num: newNum, id: nextNum, repairedAt: order.repairedAt
                        });
                    } catch (e) {}
                }
                repaired++; nextNum++;
            }
            if (nextNum > State.nextId.orders) State.nextId.orders = nextNum;
            Persistence.save();
            return repaired;
        }

        async function bootstrap() {
            console.log(`🚀 GTR POS ${APP_CONFIG.version} (Login client sans email)`);
            Theme.load();
            PrintSystem.load();
            NotificationSystem.load();
            Dashboard.load();
            Fullscreen.init();
            CustomConfirm.init();
            bindEvents();
            Auth.init();
            Persistence.load();

            setTimeout(async () => {
                try { await migratePasswords(); } catch(e) { console.error('Migrate PW:', e); }
                try { await migrateClientLogins(); } catch(e) { console.error('Migrate Login:', e); }
                try {
                    const repaired = await repairOldOrders();
                    if (repaired > 0) Toast.show(`🔧 ${repaired} commande(s) réparée(s)`, 'success');
                } catch (e) { console.error('Repair:', e); }
            }, 800);

            setTimeout(() => Dashboard.load(), 500);
            setTimeout(() => Dashboard.load(), 2000);

            setTimeout(() => {
                try {
                    const raw = sessionStorage.getItem(APP_CONFIG.sessionKey);
                    if (!raw) return;
                    const session = JSON.parse(raw);
                    if (Date.now() > session.expiresAt) {
                        sessionStorage.removeItem(APP_CONFIG.sessionKey);
                        return;
                    }
                    const client = State.clients.find(c => c.id === session.clientId);
                    if (client) {
                        State.currentClient = client;
                        State.currentUser = { login: session.login || client.login, uid: 'client_' + client.id, isClient: true };
                        $('loginOverlay').classList.add('hide');
                        ClientPortal.show();
                        console.log('✅ Session client restaurée');
                    }
                } catch(e) {}
            }, 400);

            console.log('✅ GTR POS V 0.8.7 ready');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootstrap);
        } else {
            bootstrap();
        }
    })();
    </script>
