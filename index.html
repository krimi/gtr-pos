    <script>
    (function() {
        'use strict';

        const APP_CONFIG = {
            version: 'V 0.8.7',
            storageKey: 'gtrpos_data_v36',
            themeKey: 'gtrpos_theme',
            printKey: 'gtrpos_print_settings',
            dashboardKey: 'gtrpos_dashboard_cols',
            sessionKey: 'gtrpos_session',
            staffCredsKey: 'gtrpos_staff_creds',
            adminCredsKey: 'gtrpos_admin_creds',
            adminEmail: 'krimi.neji@gmail.com',
            adminLogin: 'admin',
            maxNotifications: 50
        };

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBG_F8TMY4Mmzb1e2etzPHQTw6upu4dkrs",
            authDomain: "gdf-pos.firebaseapp.com",
            projectId: "gdf-pos",
            storageBucket: "gdf-pos.firebasestorage.app",
            messagingSenderId: "611699198002",
            appId: "1:611699198002:web:0433ab7c02f01d8403d42b"
        };

        const THEMES = {
            light: { primary:'#4a6cf7', secondary:'#1a2a5c', success:'#2ecc71', danger:'#e74c5e', warning:'#f1c40f', bg:'#f0f2f8', panel:'#ffffff', text:'#1a1f2e', muted:'#7a8499', border:'#e2e6f0' },
            dark:  { primary:'#6b8aff', secondary:'#2a3f7a', success:'#2ecc71', danger:'#e74c5e', warning:'#f1c40f', bg:'#0a0e1a', panel:'#141b2d', text:'#e8ecf4', muted:'#8892b0', border:'#2a3a5c' },
            blue:  { primary:'#1a4fd6', secondary:'#0a2a7a', success:'#27ae60', danger:'#e74c5e', warning:'#f1c40f', bg:'#e8eef8', panel:'#ffffff', text:'#0a1a3a', muted:'#6a7a9a', border:'#d0d8e8' },
            green: { primary:'#27ae60', secondary:'#1a7a40', success:'#2ecc71', danger:'#e74c5e', warning:'#f1c40f', bg:'#e8f5ee', panel:'#ffffff', text:'#0a2a1a', muted:'#5a8a6a', border:'#c8e0d0' }
        };

        const SHORTCUTS = {
            'Ctrl+N': 'Nouvelle facture', 'Ctrl+S': 'Enregistrer',
            'Ctrl+F': 'Rechercher', 'Ctrl+P': 'Imprimer',
            'F11': 'Plein écran', 'Esc': 'Fermer', 'F1': 'Aide'
        };

        const State = {
            clients: [], fournisseurs: [], articles: [],
            ventes: [], achats: [], expenses: [],
            caisseClients: [], caisseFournisseurs: [],
            orders: [],
            companyInfo: { name:'GTR POS', address:'', phone1:'', taxId:'', cashOpening:0 },
            nextId: { clients:1, fournisseurs:1, articles:1, ventes:1, achats:1,
                      expenses:1, caisseClients:1, caisseFournisseurs:1, reglements:1, orders:1 },
            currentUser: null, currentClient: null,
            storageMode: 'cloud', currentSection: 'dashboard',
            dashboardColumns: 4, isSaving: false, notifications: []
        };

        const Utils = {
            $(id) { return document.getElementById(id); },
            formatNum(n) { return Number(n || 0).toFixed(3).replace(/\./g, ','); },
            formatDate(s) {
                if (!s || s === '---') return '---';
                const p = String(s).split('-');
                return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : String(s);
            },
            today() { return new Date().toISOString().slice(0, 10); },
            monthStart() {
                const d = new Date();
                return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0, 10);
            },
            escapeHTML(str) {
                if (str == null) return '';
                return String(str).replace(/[&<>"'`=\/]/g, c => ({
                    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;',
                    "'":'&#39;', '`':'&#96;', '=':'&#61;', '/':'&#47;'
                }[c]));
            },
            escapeAttr(str) {
                return String(str == null ? '' : str)
                    .replace(/[^a-zA-Z0-9_\-\.]/g, '');
            },
            async hashPassword(password, salt) {
                const enc = new TextEncoder();
                const data = enc.encode(String(salt) + ':' + String(password) + ':gtrpos_v087');
                const buf = await crypto.subtle.digest('SHA-256', data);
                return Array.from(new Uint8Array(buf))
                    .map(b => b.toString(16).padStart(2, '0')).join('');
            },
            generateSalt() {
                const arr = new Uint8Array(16);
                crypto.getRandomValues(arr);
                return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
            },
            constantTimeEqual(a, b) {
                if (typeof a !== 'string' || typeof b !== 'string') return false;
                if (a.length !== b.length) return false;
                let diff = 0;
                for (let i = 0; i < a.length; i++)
                    diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
                return diff === 0;
            },
            isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); },
            isValidLogin(l) { return /^[a-zA-Z0-9_]{3,}$/.test(l); }
        };

        const $ = Utils.$;
        const esc = Utils.escapeHTML.bind(Utils);

        const LoginThrottle = {
            KEY: 'gtrpos_login_attempts',
            MAX: 5,
            WINDOW_MS: 15 * 60 * 1000,
            _get() {
                try { return JSON.parse(sessionStorage.getItem(this.KEY) || '[]'); }
                catch(e) { return []; }
            },
            _set(arr) { try { sessionStorage.setItem(this.KEY, JSON.stringify(arr)); } catch(e) {} },
            check(identifier) {
                const now = Date.now();
                const attempts = this._get().filter(a => a.id === identifier && now - a.at < this.WINDOW_MS);
                this._set(attempts);
                if (attempts.length >= this.MAX) {
                    const wait = Math.ceil((this.WINDOW_MS - (now - attempts[0].at)) / 60000);
                    return { blocked: true, waitMin: wait };
                }
                return { blocked: false };
            },
            record(identifier) {
                const arr = this._get();
                arr.push({ id: identifier, at: Date.now() });
                this._set(arr);
            },
            clear(identifier) {
                this._set(this._get().filter(a => a.id !== identifier));
            }
        };

        const Toast = {
            _timer: null,
            show(msg, type = 'info') {
                const el = $('toastModern');
                if (!el) return;
                const colors = { info:'var(--secondary)', success:'var(--success)',
                                 error:'var(--danger)', warning:'var(--warning)' };
                el.style.background = colors[type] || colors.info;
                el.textContent = String(msg);
                el.classList.add('show');
                clearTimeout(this._timer);
                this._timer = setTimeout(() => el.classList.remove('show'), 3000);
            }
        };

        const NotificationSystem = {
            TYPES: {
                INFO: { icon:'ℹ️', color:'#4a6cf7' },
                SUCCESS: { icon:'✅', color:'#2ecc71' },
                WARNING: { icon:'⚠️', color:'#f1c40f' },
                ERROR: { icon:'❌', color:'#e74c5e' }
            },
            _getKey() {
                const user = State.currentUser;
                if (!user) return 'gtrpos_notifications_anonymous';
                if (user.isLocalAdmin) return 'gtrpos_notifications_admin';
                if (user.uid) return 'gtrpos_notifications_' + Utils.escapeAttr(user.uid);
                if (user.login) return 'gtrpos_notifications_' + Utils.escapeAttr(user.login.toLowerCase());
                return 'gtrpos_notifications_default';
            },
            _getUserLabel() {
                const user = State.currentUser;
                if (!user) return '';
                if (user.isLocalAdmin) return 'Admin';
                return user.login || user.email || '';
            },
            load() {
                try {
                    const key = this._getKey();
                    const saved = localStorage.getItem(key);
                    State.notifications = saved ? JSON.parse(saved) : [];
                } catch(e) { State.notifications = []; }
            },
            save() {
                try {
                    const key = this._getKey();
                    localStorage.setItem(key,
                        JSON.stringify(State.notifications.slice(0, APP_CONFIG.maxNotifications)));
                } catch(e) {}
            },
            add(title, message, type = 'INFO') {
                State.notifications.unshift({
                    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
                    title, message, type,
                    timestamp: new Date().toISOString(), read: false
                });
                this.save(); this.updateBadge();
                Toast.show(`${this.TYPES[type]?.icon || 'ℹ️'} ${title}`);
            },
            markAllAsRead() {
                State.notifications.forEach(n => n.read = true);
                this.save(); this.updateBadge();
            },
            async clearAll() {
                if (!State.notifications.length) { Toast.show('⚠️ Aucune notification', 'warning'); return; }
                const ok = await CustomConfirm.show(
                    '⚠️ Supprimer TOUTES les notifications ?\n\nCette action est irréversible.',
                    '🗑️ Effacer tout'
                );
                if (!ok) return;
                State.notifications = [];
                this.save(); this.updateBadge(); this.renderPanel();
                Toast.show('🗑️ Notifications effacées', 'success');
            },
            getUnreadCount() { return State.notifications.filter(n => !n.read).length; },
            updateBadge() {
                const badge = $('notificationBadge');
                const count = this.getUnreadCount();
                if (badge) { badge.textContent = count; badge.classList.toggle('show', count > 0); }
            },
            renderPanel() {
                const panel = $('notificationPanel');
                const list = $('notificationList');
                if (!panel || !list) return;
                const title = document.querySelector('#notificationPanel h2');
                if (title) {
                    const userLabel = this._getUserLabel();
                    title.textContent = '🔔 Notifications' + (userLabel ? ' — ' + userLabel : '');
                }
                if (!State.notifications.length) {
                    list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;">Aucune notification</div>';
                } else {
                    list.innerHTML = State.notifications.slice(0, 20).map(n => {
                        const t = this.TYPES[n.type] || this.TYPES.INFO;
                        return `<div style="padding:12px;margin-bottom:8px;border-radius:8px;
                             background:${n.read?'var(--bg)':'var(--panel)'};
                             border:1px solid ${n.read?'var(--border)':t.color};
                             border-right:3px solid ${t.color};">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <span style="font-weight:700;font-size:13px;">${t.icon} ${esc(n.title)}</span>
                                <span style="font-size:10px;color:var(--muted);">${new Date(n.timestamp).toLocaleDateString('fr')} ${new Date(n.timestamp).toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'})}</span>
                            </div>
                            <div style="font-size:12px;color:var(--muted);margin-top:4px;">${esc(n.message)}</div>
                        </div>`;
                    }).join('');
                }
                panel.classList.add('show');
            }
        };

        const Theme = {
            current: 'light',
            themes: THEMES,
            load() {
                try {
                    const saved = localStorage.getItem(APP_CONFIG.themeKey);
                    if (saved && this.themes[saved]) { this.current = saved; this.apply(saved); }
                } catch(e) {}
            },
            apply(name) {
                const theme = this.themes[name];
                if (!theme) return;
                this.current = name;
                Object.entries(theme).forEach(([k, v]) =>
                    document.documentElement.style.setProperty(`--${k}`, v));
                document.body.classList.toggle('dark-mode', name === 'dark');
                try { localStorage.setItem(APP_CONFIG.themeKey, name); } catch(e) {}
            },
            toggle() {
                const names = Object.keys(this.themes);
                const idx = names.indexOf(this.current);
                const next = names[(idx + 1) % names.length];
                this.apply(next);
                Toast.show(`🎨 Thème: ${next}`);
            }
        };

        const Stock = {
            adjust(name, delta, opts = {}) {
                const a = State.articles.find(x => x.name === name);
                if (!a) return false;
                const newStock = (a.stock || 0) + delta;
                if (newStock < 0 && !opts.allowNegative) {
                    if (!opts.silent) Toast.show(`⚠️ Stock insuffisant`, 'warning');
                    return false;
                }
                a.stock = Math.max(0, newStock);
                Persistence.save();
                if (!opts.silent) ArticlesRenderer.render();
                return true;
            },
            check(name, qty) {
                const a = State.articles.find(x => x.name === name);
                return { available: (a?.stock || 0) >= qty, stock: a?.stock || 0 };
            },
            getValue() {
                return State.articles.reduce((s, a) => s + ((a.stock || 0) * (a.costPrice || a.price || 0)), 0);
            },
            getOpeningValue() {
                return State.articles.reduce((s, a) => {
                    const st = a.stockDepart !== undefined ? a.stockDepart : (a.stock || 0);
                    return s + (st * (a.costPrice || a.price || 0));
                }, 0);
            }
        };

        const BalanceCalculator = {
            _cfg: {
                client: { list:() => State.clients, docs:() => State.ventes, caisse:() => State.caisseClients, docKey:'client', caisseKey:'clientName' },
                supplier: { list:() => State.fournisseurs, docs:() => State.achats, caisse:() => State.caisseFournisseurs, docKey:'supplier', caisseKey:'fournisseurName' }
            },
            recalculate(type, name) {
                const cfg = this._cfg[type];
                if (!cfg) return null;
                const entity = cfg.list().find(x => x.name === name);
                if (!entity) return null;
                const totalDocs = cfg.docs().filter(d => d[cfg.docKey] === name).reduce((s, d) => s + (d.total || 0), 0);
                const totalPaid = cfg.caisse().filter(c => c[cfg.caisseKey] === name).reduce((s, c) => s + (c.amount || 0), 0);
                entity.balance = (entity.openingBalance || 0) + totalDocs - totalPaid;
                Persistence.save();
                return entity.balance;
            },
            recalculateClient(n) { return this.recalculate('client', n); },
            recalculateSupplier(n) { return this.recalculate('supplier', n); },
            recalculateAll() {
                State.clients.forEach(c => this.recalculateClient(c.name));
                State.fournisseurs.forEach(f => this.recalculateSupplier(f.name));
            }
        };

        // ═══════════════════════════════════════════════════
        // ☁️ ClientLoginsSync — مزامنة Logins الحرفاء مع Firebase
        // ═══════════════════════════════════════════════════
        const ClientLoginsSync = {
            COLLECTION: 'client_logins',
            
            async syncOne(client) {
                if (typeof firebase === 'undefined' || !window.db) return false;
                if (!client || !client.login || !client.passwordHash || !client.passwordSalt) return false;
                try {
                    const docId = 'login_' + client.login.toLowerCase();
                    await window.db.collection(this.COLLECTION).doc(docId).set({
                        login: client.login.toLowerCase(),
                        clientData: {
                            id: client.id,
                            name: client.name,
                            login: client.login,
                            passwordHash: client.passwordHash,
                            passwordSalt: client.passwordSalt,
                            phone: client.phone || '',
                            phone2: client.phone2 || '',
                            email: client.email || '',
                            address: client.address || '',
                            taxId: client.taxId || '',
                            openingBalance: client.openingBalance || 0,
                            specialPrices: client.specialPrices || []
                        },
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                    console.log(`✅ Login "${client.login}" synchronisé`);
                    return true;
                } catch(e) {
                    console.warn(`⚠️ Sync login "${client.login}" échoué:`, e.message);
                    return false;
                }
            },

            async deleteOne(login) {
                if (typeof firebase === 'undefined' || !window.db) return false;
                if (!login) return false;
                try {
                    await window.db.collection(this.COLLECTION).doc('login_' + login.toLowerCase()).delete();
                    return true;
                } catch(e) {
                    console.warn('⚠️ Delete login failed:', e.message);
                    return false;
                }
            },

            async lookup(login) {
                if (typeof firebase === 'undefined' || !window.db) return null;
                if (!login) return null;
                try {
                    const doc = await window.db.collection(this.COLLECTION).doc('login_' + login.toLowerCase()).get();
                    if (doc.exists) return doc.data().clientData || null;
                } catch(e) {
                    console.warn('⚠️ Lookup failed:', e.message);
                }
                return null;
            },

            async syncAll() {
                if (typeof firebase === 'undefined' || !window.db) {
                    Toast.show('⚠️ Firebase non disponible', 'warning');
                    return { ok: 0, fail: 0 };
                }
                let ok = 0, fail = 0;
                for (const c of State.clients) {
                    if (c.login && c.passwordHash) {
                        const success = await this.syncOne(c);
                        if (success) ok++; else fail++;
                    }
                }
                return { ok, fail };
            }
        };

        const Persistence = {
            serialize() {
                return {
                    clients: State.clients, fournisseurs: State.fournisseurs,
                    articles: State.articles, ventes: State.ventes, achats: State.achats,
                    expenses: State.expenses, caisseClients: State.caisseClients,
                    caisseFournisseurs: State.caisseFournisseurs,
                    orders: State.orders,
                    nextId: State.nextId, companyInfo: State.companyInfo
                };
            },
            deserialize(data) {
                if (!data) return;
                State.clients = data.clients || [];
                State.fournisseurs = data.fournisseurs || [];
                State.articles = data.articles || [];
                State.ventes = data.ventes || [];
                State.achats = data.achats || [];
                State.expenses = data.expenses || [];
                State.caisseClients = data.caisseClients || [];
                State.caisseFournisseurs = data.caisseFournisseurs || [];
                State.orders = data.orders || [];
                State.nextId = data.nextId || { clients:1, fournisseurs:1, articles:1, ventes:1, achats:1, expenses:1, caisseClients:1, caisseFournisseurs:1, reglements:1, orders:1 };
                if (typeof State.nextId.orders !== 'number' || isNaN(State.nextId.orders)) {
                    State.nextId.orders = 1;
                }
                State.companyInfo = data.companyInfo || { name:'GTR POS', address:'', phone1:'', taxId:'', cashOpening:0 };
                if (!State.companyInfo.cashOpening) State.companyInfo.cashOpening = 0;
            },
            save() {
                try {
                    const dataStr = JSON.stringify(this.serialize());
                    localStorage.setItem(APP_CONFIG.storageKey, dataStr);
                    if (window.db && State.currentUser && State.currentUser.uid
                        && !State.currentUser.isClient
                        && !State.currentUser.isLocalAdmin
                        && !String(State.currentUser.uid).startsWith('admin_')
                        && !String(State.currentUser.uid).startsWith('client_')) {
                        window.db.collection('users').doc(State.currentUser.uid).set(this.serialize())
                            .then(() => console.log('☁️ Firestore sauvegardé'))
                            .catch(e => console.error('❌ Firestore error:', e.message));
                    }
                    this.syncVentesToShared();
                    return true;
                } catch(e) {
                    console.error('❌ Erreur save:', e);
                    return false;
                }
            },
            async syncVentesToShared() {
                if (typeof firebase === 'undefined' || !window.db) return;
                if (!State.currentUser || State.currentUser.isClient || State.currentUser.isLocalAdmin) return;
                const fbUser = firebase.auth().currentUser;
                if (!fbUser) return;
                try {
                    const batch = window.db.batch();
                    const ventesWithLogin = State.ventes.filter(v => {
                        const client = State.clients.find(c => c.name === v.client);
                        return client && (client.login || client.email);
                    });
                    const toSync = ventesWithLogin.slice(0, 500);
                    toSync.forEach(v => {
                        const client = State.clients.find(c => c.name === v.client);
                        const ref = window.db.collection('shared_ventes').doc('v_' + v.id);
                        batch.set(ref, {
                            ...v,
                            clientEmail: client.email || '',
                            clientLogin: client.login || '',
                            clientId: client.id,
                            clientUid: 'client_' + client.id,
                            syncedAt: new Date().toISOString()
                        }, { merge: true });
                    });
                    await batch.commit();
                    console.log(`✅ ${toSync.length} ventes synchronisées`);
                } catch(e) {
                    console.warn('⚠️ syncVentesToShared:', e.message);
                }
            },
            load() {
                try {
                    const raw = localStorage.getItem(APP_CONFIG.storageKey);
                    if (!raw) {
                        const old = localStorage.getItem('gtrpos_data_v35') || localStorage.getItem('gtrpos_data_v34');
                        if (old) {
                            console.log('🔄 Migration vers v36...');
                            this.deserialize(JSON.parse(old));
                            this.save();
                        }
                        return !!old;
                    }
                    this.deserialize(JSON.parse(raw));
                    return true;
                } catch(e) { return false; }
            },
            async loadFromCloud(uid) {
                if (!window.db) { this.load(); return; }
                try {
                    const doc = await window.db.collection('users').doc(uid).get();
                    if (doc.exists) {
                        this.deserialize(doc.data());
                        try { localStorage.setItem(APP_CONFIG.storageKey, JSON.stringify(this.serialize())); } catch(e) {}
                        Toast.show('☁️ Données cloud chargées', 'success');
                    } else {
                        this.load();
                        try { await window.db.collection('users').doc(uid).set(this.serialize()); } catch(e) {}
                    }
                } catch(e) {
                    console.error('❌ Erreur cloud:', e.message);
                    this.load();
                    Toast.show('⚠️ Mode hors ligne', 'warning');
                }
            },
            export() {
                const data = { ...this.serialize(), exportedAt: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `gtrpos_backup_${Utils.today()}.json`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
                Toast.show('✅ Exporté');
            },
            import(file) {
                if (!file || !file.name.endsWith('.json')) { Toast.show('⚠️ Fichier JSON requis'); return; }
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const data = JSON.parse(e.target.result);
                        this.deserialize(data);
                        this.save();
                        App.reloadAll();
                        Toast.show(`✅ Importé`);
                    } catch(err) { Toast.show('❌ Erreur'); }
                };
                reader.readAsText(file);
            }
        };

        const PrintSystem = {
            settings: { logo: null, footer: 'Merci de votre visite', fontSize: 'medium' },
            _currentData: null,
            load() {
                try {
                    const saved = localStorage.getItem(APP_CONFIG.printKey);
                    if (saved) Object.assign(this.settings, JSON.parse(saved));
                } catch(e) {}
            },
            save() {
                this.settings.footer = $('customFooter').value.trim() || 'Merci de votre visite';
                this.settings.fontSize = $('fontSizeSelect').value || 'medium';
                try {
                    localStorage.setItem(APP_CONFIG.printKey, JSON.stringify(this.settings));
                    Toast.show('✅ Enregistré', 'success');
                    this.closeCustomizer();
                } catch(e) {}
            },
            async reset() {
                const ok = await CustomConfirm.show('⚠️ Restaurer ?');
                if (!ok) return;
                this.settings = { logo:null, footer:'Merci de votre visite', fontSize:'medium' };
                localStorage.removeItem(APP_CONFIG.printKey);
                this.updateCustomizerUI();
            },
            openCustomizer() { this.load(); this.updateCustomizerUI(); $('printCustomizerModal').classList.add('show'); },
            closeCustomizer() { $('printCustomizerModal').classList.remove('show'); },
            updateCustomizerUI() {
                $('customFooter').value = this.settings.footer || '';
                $('fontSizeSelect').value = this.settings.fontSize || 'medium';
                const img = $('logoPreviewImg'), name = $('logoFileName');
                if (this.settings.logo) { img.src = this.settings.logo; img.style.display = 'block'; name.textContent = '✅ Logo'; }

            CHAR_UUID: '00002af1-0000-1000-8000-00805f9b34fb',
            async print(text) {
                if (!navigator.bluetooth) { Toast.show('❌ Bluetooth non supporté', 'error'); return; }
                try {
                    Toast.show('⏳ Connexion...', 'info');
                    const device = await navigator.bluetooth.requestDevice({
                        filters: [{ services: [this.SERVICE_UUID] }],
                        optionalServices: [this.SERVICE_UUID]
                    });
                    const server = await device.gatt.connect();
                    const service = await server.getPrimaryService(this.SERVICE_UUID);
                    const char = await service.getCharacteristic(this.CHAR_UUID);
                    await char.writeValue(new TextEncoder().encode(text));
                    Toast.show('✅ Impression envoyée', 'success');
                } catch(err) { Toast.show('❌ ' + err.message, 'error'); }
            }
        };

        const ChartRenderer = {
            drawBars(canvas, { labels, values, colors }) {
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.parentElement.getBoundingClientRect();
                const W = rect.width || 340, H = 200;
                canvas.width = W * 2; canvas.height = H * 2;
                canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
                ctx.scale(2, 2); ctx.clearRect(0, 0, W, H);
                if (!labels.length) {
                    ctx.fillStyle = '#999'; ctx.font = '12px Cairo'; ctx.textAlign = 'center';
                    ctx.fillText('Aucune donnée', W / 2, H / 2); return;
                }
                const pad = { top: 15, bottom: 25, left: 30, right: 10 };
                const cW = W - pad.left - pad.right, cH = H - pad.top - pad.bottom;
                const max = Math.max(...values, 1);
                const defColors = ['#4a6cf7', '#2ecc71', '#e74c5e', '#f39c12'];
                ctx.strokeStyle = 'rgba(200,200,200,0.3)'; ctx.lineWidth = 0.5;
                for (let i = 0; i < 4; i++) {
                    const y = pad.top + (cH / 4) * i;
                    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
                }
                const barW = Math.min(cW / labels.length * 0.5, 18);
                const gap = cW / labels.length;
                values.forEach((val, i) => {
                    const x = pad.left + i * gap + (gap - barW) / 2;
                    const bH = Math.max((val / max) * cH, 2);
                    const y = pad.top + cH - bH;
                    const col = (colors || defColors)[i % (colors || defColors).length];
                    const grad = ctx.createLinearGradient(x, y, x, pad.top + cH);
                    grad.addColorStop(0, col); grad.addColorStop(1, col + '88');
                    ctx.fillStyle = grad; ctx.fillRect(x, y, barW, bH);
                    ctx.fillStyle = '#333'; ctx.font = '6px Cairo'; ctx.textAlign = 'center';
                    ctx.fillText(val.toFixed(1), x + barW / 2, y - 4);
                    ctx.fillStyle = '#888';
                    const lbl = labels[i] || '';
                    ctx.fillText(lbl.length > 8 ? lbl.slice(0, 6) + '..' : lbl, x + barW / 2, pad.top + cH + 14);
                });
            },
            drawPie(canvas, { labels, values, colors }) {
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.parentElement.getBoundingClientRect();
                const W = rect.width || 340, H = 200;
                canvas.width = W * 2; canvas.height = H * 2;
                canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
                ctx.scale(2, 2); ctx.clearRect(0, 0, W, H);
                const total = values.reduce((s, v) => s + Math.max(v, 0), 0);
                if (total <= 0) return;
                const cx = W / 2, cy = H / 2 + 5;
                const r = Math.min(W, H) / 2 - 30;
                const defColors = ['#4a6cf7', '#e74c5e', '#f39c12', '#2ecc71'];
                let start = -Math.PI / 2;
                values.forEach((v, i) => {
                    if (v <= 0) { start += 0.01; return; }
                    const angle = (v / total) * 2 * Math.PI;
                    const end = start + angle;
                    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, end); ctx.closePath();
                    ctx.fillStyle = (colors || defColors)[i % (colors || defColors).length];
                    ctx.fill();
                    const mid = start + angle / 2;
                    const lx = cx + Math.cos(mid) * r * 0.6;
                    const ly = cy + Math.sin(mid) * r * 0.6;
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Cairo';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(((v / total) * 100).toFixed(1) + '%', lx, ly);
                    start = end;
                });
            }
        };

                if (user.email && (user.email.toLowerCase().trim() === APP_CONFIG.adminEmail.toLowerCase() ||

                if (user.isStaff) return 'staff';

                if (client) { State.currentClient = client; return 'client'; }
                return 'staff';
            },

            isStaff() { return this.getRole() === 'staff'; },

                    note: $('coNote').value.trim(),
                    status: 'pending',
                    createdAt: new Date().toISOString()
                };
                State.nextId.orders = orderId + 1;
                State.orders.push(order);
                Persistence.save();
                const ok = await this.syncToCloud(order);
                if (ok) {
                    Toast.show('✅ Commande envoyée au vendeur', 'success');
                    this.close();
                    setTimeout(() => ClientPortal.render(), 150);
                } else {
                    $('coError').textContent = '⚠️ Synchronisation échouée — commande locale enregistrée';
                }
            },
            async syncToCloud(order) {
                if (typeof firebase === 'undefined') return false;
                const currentUser = firebase.auth().currentUser;
                if (!currentUser) {
                    Toast.show('⚠️ Session Firebase expirée', 'warning');
                    return false;
                }
                try {
                    const client = State.currentClient;
                    const db = firebase.firestore();
                    await db.collection('orders').doc('order_' + order.id + '_' + Date.now()).set({
                        ...order,
                        clientLogin: client?.login || '',
                        clientEmail: client?.email || '',
                        clientUid: currentUser.uid,
                        syncedAt: new Date().toISOString(),
                        source: 'client-portal'
                    });
                    return true;
                } catch(e) {
                    Toast.show('⚠️ Erreur sync : ' + e.message, 'warning');
                    return false;
                }
            }
        };

        const ClientPortal = {
            _ordersUnsub: null,
            _ventesUnsub: null,
            show() {
                const client = State.currentClient;
                if (!client) { Toast.show('❌ Client introuvable', 'error'); return; }
                $('clientPortal').classList.add('show');
                $('loginOverlay').classList.add('hide');
                $('pendingOverlay').classList.add('hide');
                document.querySelector('.phone').style.display = 'none';
                $('cpClientName').textContent = client.name || 'Client';
                BalanceCalculator.recalculateClient(client.name);
                this.render();
                this.startClientOrderListener();
                this.startClientVentesListener();
            },
            hide() {
                this.stopClientOrderListener();
                if (this._ventesUnsub) { this._ventesUnsub(); this._ventesUnsub = null; }
                $('clientPortal').classList.remove('show');
                document.querySelector('.phone').style.display = 'flex';
                State.currentClient = null;
            },
            startClientOrderListener() {
                if (typeof firebase === 'undefined') return;
                if (this._ordersUnsub) this._ordersUnsub();
                const client = State.currentClient;
                if (!client) return;
                const currentUser = firebase.auth().currentUser;
                if (!currentUser) return;
                try {
                    this._ordersUnsub = firebase.firestore().collection('orders')
                        .where('clientUid', '==', currentUser.uid)
                        .onSnapshot(snapshot => {
                            let changed = false;
                            snapshot.docChanges().forEach(change => {
                                const data = change.doc.data();
                                const cloudId = change.doc.id;
                                const idx = State.orders.findIndex(o =>
                                    o.cloudId === cloudId ||
                                    (o.num === data.num && o.clientName === data.clientName)
                                );
                                if (idx === -1 && change.type !== 'removed') {
                                    State.orders.push({ ...data, cloudId });
                                    changed = true;
                                } else if (idx !== -1) {
                                    if (change.type === 'removed') { State.orders.splice(idx, 1); changed = true; }
                                    else {
                                        State.orders[idx] = { ...State.orders[idx], ...data, cloudId };
                                        changed = true;
                                    }
                                }
                            });
                            if (changed) {
                                try { localStorage.setItem(APP_CONFIG.storageKey, JSON.stringify(Persistence.serialize())); } catch(e) {}
                                this.renderOrders(); this.render();
                            }
                        }, err => console.warn('⚠️ orders listener:', err.message));
                } catch(e) { console.error(e); }
            },
            stopClientOrderListener() {
                if (this._ordersUnsub) { this._ordersUnsub(); this._ordersUnsub = null; }
            },
            startClientVentesListener() {
                if (typeof firebase === 'undefined') return;
                if (this._ventesUnsub) this._ventesUnsub();
                const client = State.currentClient;
                if (!client || (!client.login && !client.email)) return;
                const currentUser = firebase.auth().currentUser;
                if (!currentUser) return;
                try {
                    this._ventesUnsub = firebase.firestore().collection('shared_ventes')
                        .where('clientLogin', '==', client.login || '')
                        .onSnapshot(snapshot => {
                            let changed = false;
                            snapshot.docChanges().forEach(change => {
                                const data = change.doc.data();
                                const cloudId = change.doc.id;
                                const vId = data.id;
                                const idx = State.ventes.findIndex(v =>
                                    v.cloudVenteId === cloudId || v.id === vId
                                );
                                if (change.type === 'added' || change.type === 'modified') {
                                    const merged = { ...data, cloudVenteId: cloudId };
                                    if (idx === -1) State.ventes.push(merged);
                                    else State.ventes[idx] = { ...State.ventes[idx], ...merged };
                                    changed = true;
                                } else if (change.type === 'removed' && idx !== -1) {
                                    State.ventes.splice(idx, 1); changed = true;
                                }
                            });
                            if (changed) {
                                try { localStorage.setItem(APP_CONFIG.storageKey, JSON.stringify(Persistence.serialize())); } catch(e) {}
                                BalanceCalculator.recalculateClient(client.name);
                                this.render();
                            }
                        }, err => console.warn('⚠️ ventes listener:', err.message));
                } catch(e) { console.error(e); }
            },
            render() {
                const client = State.currentClient;
                if (!client) return;
                const name = client.name;
                const invoices = State.ventes.filter(v => v.client === name);
                const payments = State.caisseClients.filter(c => c.clientName === name);
                const totalPurchases = invoices.reduce((s, v) => s + (v.total || 0), 0);
                const totalPaid = payments.reduce((s, p) => s + (p.amount || 0), 0);
                const balance = client.balance || 0;
                $('cpBalance').textContent = balance.toFixed(3) + ' TND';
                const noteEl = $('cpBalanceNote');
                if (Math.abs(balance) < 0.001) {
                    noteEl.textContent = '✅ À jour'; noteEl.className = 'cp-balance-note positive';
                } else if (balance > 0) {
                    noteEl.textContent = '⚠️ Reste à payer: ' + balance.toFixed(3) + ' TND';
                    noteEl.className = 'cp-balance-note negative';
                } else {
                    noteEl.textContent = '💰 Crédit: ' + Math.abs(balance).toFixed(3) + ' TND';
                    noteEl.className = 'cp-balance-note positive';
                }
                $('cpInvoiceCount').textContent = invoices.length;
                $('cpTotalPurchases').textContent = totalPurchases.toFixed(3);
                $('cpTotalPaid').textContent = totalPaid.toFixed(3);
                this.renderInvoices(invoices, payments);
                this.renderPayments(payments);
                this.renderOrders();
            },
            renderInvoices(invoices) {
                const container = $('cpInvoicesList');
                if (!invoices.length) { container.innerHTML = '<div class="cp-empty">📭 Aucune facture</div>'; return; }
                const sorted = [...invoices].sort((a, b) => a.date < b.date ? 1 : -1);
                container.innerHTML = sorted.slice(0, 30).map(v => {
                    const paid = (v.reglements || []).reduce((s, r) => s + r.amount, 0);
                    const rem = (v.total || 0) - paid;
                    const isPaymentOnly = !v.lines || !v.lines.length;
                    let badge, badgeClass;
                    if (isPaymentOnly) { badge = '💰 Règlement'; badgeClass = 'payment'; }
                    else if (rem <= 0.001) { badge = '✅ Payée'; badgeClass = 'paid'; }
                    else if (rem >= v.total - 0.001) { badge = '⏳ Non payée'; badgeClass = 'pending'; }
                    else { badge = '🔄 Partielle'; badgeClass = 'partial'; }
                    const amountDisplay = isPaymentOnly ? paid : (v.total || 0);
                    return `<div class="cp-row">
                        <div class="cp-row-info">
                            <div class="name">${esc(v.num)}<span class="cp-badge ${badgeClass}">${badge}</span></div>
                            <div class="meta">${esc(Utils.formatDate(v.date))}</div>
                        </div>
                        <div class="cp-row-amount">
                            ${amountDisplay.toFixed(3)} TND
                            ${!isPaymentOnly && rem > 0.001 ? `<small style="color:var(--danger);">Reste: ${rem.toFixed(3)}</small>` : ''}
                        </div>
                    </div>`;
                }).join('');
            },
            renderPayments(payments) {
                const container = $('cpPaymentsList');
                if (!payments.length) { container.innerHTML = '<div class="cp-empty">📭 Aucun paiement</div>'; return; }
                const sorted = [...payments].sort((a, b) => a.date < b.date ? 1 : -1);
                container.innerHTML = sorted.slice(0, 30).map(p => `
                    <div class="cp-row">
                        <div class="cp-row-info">
                            <div class="name">💳 ${esc(p.regType || 'Espèces')}</div>
                            <div class="meta">${esc(Utils.formatDate(p.date))} • ${esc(p.invoiceNum || '-')}</div>
                        </div>
                        <div class="cp-row-amount">
                            <span class="paid">${(p.amount || 0).toFixed(3)} TND</span>
                        </div>
                    </div>
                `).join('');
            },
            renderOrders() {
                const c = $('cpOrdersList');
                if (!c) return;
                const client = State.currentClient;
                if (!client) return;
                const orders = State.orders
                    .filter(o => o.clientId === client.id || o.clientName === client.name)
                    .sort((a, b) => (b.createdAt || b.date) < (a.createdAt || a.date) ? -1 : 1);
                if (!orders.length) { c.innerHTML = '<div class="cp-empty">📭 Aucune commande</div>'; return; }
                const statusMap = {
                    pending:  { lbl: '⏳ En attente', cls: 'pending' },
                    approved: { lbl: '✅ Acceptée',   cls: 'paid' },
                    rejected: { lbl: '❌ Refusée',    cls: 'partial' },
                    delivered:{ lbl: '🚚 Livrée',     cls: 'paid' }
                };
                c.innerHTML = orders.slice(0, 10).map(o => {
                    const s = statusMap[o.status] || statusMap.pending;
                    return `<div class="cp-row">
                        <div class="cp-row-info">
                            <div class="name">${esc(o.num)}<span class="cp-badge ${s.cls}">${s.lbl}</span></div>
                            <div class="meta">${esc(Utils.formatDate(o.date))} ${esc(o.time || '')} • ${o.lines.length} article(s)</div>
                        </div>
                        <div class="cp-row-amount">${o.total.toFixed(3)} TND</div>
                    </div>`;
                }).join('');
            },
            printStatement() {
                const client = State.currentClient;
                if (!client) return;
                BalanceCalculator.recalculateClient(client.name);
                const docs = State.ventes.filter(v => v.client === client.name).sort((a, b) => a.date < b.date ? -1 : 1);
                const pays = State.caisseClients.filter(p => p.clientName === client.name);
                const pendingOrders = State.orders.filter(o =>
                    (o.clientId === client.id || o.clientName === client.name) &&
                    (o.status === 'pending' || o.status === 'approved')
                );
                showPreviewReleve('client', client, docs, pays, pendingOrders);
            },
            shareWhatsapp() {
                const client = State.currentClient;
                if (!client) return;
                const invoices = State.ventes.filter(v => v.client === client.name);
                const totalPurchases = invoices.reduce((s, v) => s + (v.total || 0), 0);
                const payments = State.caisseClients.filter(c => c.clientName === client.name);
                const totalPaid = payments.reduce((s, p) => s + (p.amount || 0), 0);
                const balance = client.balance || 0;
                const text = `🏢 *${State.companyInfo.name}*\n📋 Relevé de compte\n\n👤 ${client.name}\n📊 Solde: *${balance.toFixed(3)} TND*\n\n📄 Factures: ${invoices.length}\n💰 Achats: ${totalPurchases.toFixed(3)} TND\n💳 Payé: ${totalPaid.toFixed(3)} TND\n\n📞 ${State.companyInfo.phone1 || ''}`;
                const phone = (client.phone || '').replace(/\D/g, '');
                const url = phone ? `https://wa.me/216${phone}?text=${encodeURIComponent(text)}` : `https://wa.me/?text=${encodeURIComponent(text)}`;
                window.open(url, '_blank');
                Toast.show('✅ WhatsApp ouvert', 'success');
            }
        };

        function createEntityModule(cfg) {
            return {
                editingId: null, list: cfg.list, prefix: cfg.prefix, _specialPrices: [],
                reset() {
                    this.editingId = null; this._specialPrices = [];
                    const id = State.nextId[cfg.table];
                    $(cfg.fields.code).value = cfg.prefix + '-' + String(id).padStart(4, '0');
                    Object.entries(cfg.fields).forEach(([key, elId]) => {
                        if (key === 'code') return;
                        const el = $(elId);
                        if (!el) return;
                        if (key === 'openingBalance' || key === 'balance') el.value = '0';
                        else if (key === 'minStock') el.value = '5';
                        else if (key === 'stock' || key === 'stockDepart') el.value = '0';
                        else el.value = '';
                    });
                    if (cfg.onReset) cfg.onReset.call(this);
                },
                async save() {
                    if (cfg.validate) {
                        const ok = await cfg.validate.call(this);
                        if (!ok) return;
                    }
                    const data = await cfg.collect.call(this);
                    if (this.editingId) {
                        const idx = this.list().findIndex(x => x.id === this.editingId);
                        if (idx !== -1) this.list()[idx] = { ...data, id: this.editingId };
                    } else {
                        this.list().push({ ...data, id: State.nextId[cfg.table]++ });
                    }
                    if (cfg.onSave) cfg.onSave.call(this, data);
                    Persistence.save();
                    cfg.renderer.render();
                    App.closeSheet();
                    Toast.show(this.editingId ? '✅ Modifié' : '✅ Enregistré');
                },
                edit() {
                    if (this.editingId == null) { Toast.show('⚠️ Choisissez'); return; }
                    this.save();
                },
                async remove() {
                    if (this.editingId == null) { Toast.show('⚠️ Choisissez'); return; }
                    const item = this.list().find(x => x.id === this.editingId);
                    if (!item) return;
                    if (cfg.canDelete && !cfg.canDelete(item)) return;
                    const ok = await CustomConfirm.show(`Voulez-vous supprimer "${item.name}" ?`);
                    if (!ok) return;
                    if (cfg.onDelete) cfg.onDelete.call(this, item);
                    const idx = this.list().findIndex(x => x.id === this.editingId);
                    this.list().splice(idx, 1);
                    Persistence.save();
                    cfg.renderer.render();
                    App.closeSheet();
                    Toast.show('🗑️ Supprimé');
                },
                load(id) {
                    const item = this.list().find(x => x.id === id);
                    if (!item) return;
                    this.editingId = id;
                    Object.entries(cfg.fields).forEach(([key, elId]) => {
                        const el = $(elId);
                        if (!el) return;
                        if (key === 'password') return;
                        el.value = item[key] !== undefined ? item[key] : '';
                    });
                    $(cfg.fields.code).value = cfg.prefix + '-' + String(id).padStart(4, '0');
                    if (cfg.onLoad) cfg.onLoad.call(this, item);
                    App.openSheet(cfg.sheet);
                }
            };
        }

        function createTransactionModule(cfg) {
            return {
                editingId: null, lines: [], reglements: [],
                originalBalance: 0, originalPartyId: null,
                editingRowIndex: null, isSaved: false,
                partyTaxId: '', partyAddress: '', partyEmail: '', partySpecialPrices: [],
                _skipStockAdjust: false,
                reset() {
                    this.editingId = null; this.lines = []; this.reglements = [];
                    const sheetEl = $('sheet-' + cfg.sheet);
                    if (sheetEl) {
                        const body = sheetEl.querySelector('.sheet-body');
                        if (body) body.scrollTop = 0;
                    }
                    this.originalBalance = 0; this.originalPartyId = null;
                    this.editingRowIndex = null; this.isSaved = false;
                    this.partyTaxId = ''; this.partyAddress = ''; this.partyEmail = ''; this.partySpecialPrices = [];
                    this._skipStockAdjust = false;
                    const num = cfg.prefix + '-' + String(State.nextId[cfg.table]).padStart(4, '0');
                    const date = Utils.today();
                    $(cfg.numDisplay).textContent = '#' + num;
                    $(cfg.dateDisplay).textContent = Utils.formatDate(date);
                    $(cfg.numField).value = num;
                    $(cfg.dateField).value = date;
                    $(cfg.partySelect).value = '';
                    $(cfg.partyPhone).textContent = '-';
                    if (cfg.partyEmail) $(cfg.partyEmail).textContent = '-';
                    if (cfg.partyTaxId) $(cfg.partyTaxId).textContent = '-';
                    $(cfg.articleSelect).value = '';
                    $(cfg.priceInput).value = '';
                    $(cfg.qtyInput).value = 1;
                    $(cfg.totalInput).value = '';
                    if (cfg.stockHint) $(cfg.stockHint).textContent = 'Stock: -';
                    this.renderLines(); this.renderReglements();
                    this.refreshArticleOptions(); this.refreshPartyOptions();
                    this.updateAccountSummary();
                },
                refreshPartyOptions() {
                    const s = $(cfg.partySelect);
                    if (s) s.innerHTML = '<option value="">-- Choisir --</option>' +
                        cfg.partyList().map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
                },
                refreshArticleOptions() {
                    const used = this.lines.map(l => l.name);
                    const avail = State.articles.filter(a => !used.includes(a.name));
                    const s = $(cfg.articleSelect);
                    if (s) s.innerHTML = '<option value="">-- Choisir --</option>' +
                        avail.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');
                },
                fillParty() {
                    const p = cfg.partyList().find(x => x.id == $(cfg.partySelect).value);
                    if (p) {
                        $(cfg.partyPhone).textContent = p.phone || '-';
                        if (cfg.partyEmail) $(cfg.partyEmail).textContent = p.login || p.email || '-';
                        if (cfg.partyTaxId) $(cfg.partyTaxId).textContent = p.taxId || '-';
                        if (cfg.partyAddress && $(cfg.partyAddress)) $(cfg.partyAddress).textContent = p.address || '-';
                        this.originalPartyId = p.id;
                        this.originalBalance = p.balance || 0;
                        this.partyTaxId = p.taxId || '';
                        this.partyAddress = p.address || '';
                        this.partyEmail = p.login || p.email || '';
                        this.partySpecialPrices = p.specialPrices ? [...p.specialPrices] : [];
                    } else {
                        $(cfg.partyPhone).textContent = '-';
                        if (cfg.partyEmail) $(cfg.partyEmail).textContent = '-';
                        if (cfg.partyTaxId) $(cfg.partyTaxId).textContent = '-';
                        this.originalPartyId = null; this.originalBalance = 0;
                        this.partyTaxId = ''; this.partyAddress = '';
                        this.partyEmail = ''; this.partySpecialPrices = [];
                    }
                    this.updateAccountSummary(); this.refreshArticleOptions();
                },
                fillArticle() {
                    const a = State.articles.find(x => x.id == $(cfg.articleSelect).value);
                    if (!a) { $(cfg.priceInput).value = ''; if (cfg.stockHint) $(cfg.stockHint).textContent = 'Stock: -'; this.calcLine(); return; }
                    let price = cfg.isPurchase ? (a.costPrice || a.price) : a.price;
                    let hint = '';
                    if (!cfg.isPurchase) {
                        hint = 'Stock: ' + (a.stock || 0);
                        if (this.originalPartyId && this.partySpecialPrices) {
                            const sp = this.partySpecialPrices.find(s => s.name === a.name);
                            if (sp) { price = sp.price; hint = `⭐ Spécial: ${sp.price.toFixed(3)} (Stock: ${a.stock || 0})`; }
                        }
                        if (a.stock <= 5 && a.stock > 0) hint += ' ⚠️';
                        else if (a.stock <= 0) hint += ' ❌';
                    } else { hint = `Stock: ${a.stock || 0} (sera ajouté)`; }
                    if (cfg.stockHint) $(cfg.stockHint).textContent = hint;
                    $(cfg.priceInput).value = price.toFixed(3);
                    this.calcLine();
                },
                calcLine() {
                    const p = parseFloat($(cfg.priceInput).value) || 0;
                    const q = parseFloat($(cfg.qtyInput).value) || 0;
                    $(cfg.totalInput).value = (p * q).toFixed(3);
                },
                addLine() {
                    const sel = $(cfg.articleSelect);
                    const name = sel.value ? sel.options[sel.selectedIndex].textContent : '';
                    const price = parseFloat($(cfg.priceInput).value) || 0;
                    const qty = parseFloat($(cfg.qtyInput).value) || 0;
                    if (!name || price <= 0 || qty <= 0) { Toast.show('⚠️ Données invalides', 'warning'); return; }
                    if (!cfg.isPurchase) {
                        const inCart = this.lines.filter(l => l.name === name).reduce((s, l) => s + l.qty, 0);
                        const c = Stock.check(name, qty + inCart);
                        if (!c.available) { Toast.show(`⚠️ Stock insuffisant: ${c.stock}`, 'warning'); return; }
                    }
                    const existing = this.lines.find(l => l.name === name);
                    if (existing) {
                        existing.qty += qty;
                        existing.total = existing.price * existing.qty;
                    } else {
                        this.lines.push({ name, price, qty, total: price * qty });
                    }
                    $(cfg.articleSelect).value = '';
                    $(cfg.priceInput).value = '';
                    $(cfg.qtyInput).value = 1;
                    $(cfg.totalInput).value = '';
                    if (cfg.stockHint) $(cfg.stockHint).textContent = 'Stock: -';
                    this.renderLines(); this.refreshArticleOptions();
                    this.updateAccountSummary();
                    if (cfg.paymentOnlyNotice && $(cfg.paymentOnlyNotice)) $(cfg.paymentOnlyNotice).style.display = 'none';
                    Toast.show('✅ Ajouté', 'success');
                },
                removeLine(idx) {
                    this.lines.splice(idx, 1);
                    if (this.editingRowIndex === idx) this.editingRowIndex = null;
                    this.renderLines(); this.refreshArticleOptions();
                    this.updateAccountSummary();
                },
                editLine(idx) { this.editingRowIndex = idx; this.renderLines(); },
                saveEditLine(idx) {
                    const row = document.querySelector(`#${cfg.linesBody} tr:nth-child(${idx+1})`);
                    if (!row) return;
                    const price = parseFloat(row.querySelector('.edit-price').value) || 0;
                    const qty = parseFloat(row.querySelector('.edit-qty').value) || 0;
                    if (price <= 0 || qty <= 0) return;
                    const old = this.lines[idx];
                    if (!cfg.isPurchase) {
                        const inCartOthers = this.lines.filter((l, i) => i !== idx && l.name === old.name).reduce((s, l) => s + l.qty, 0);
                        const c = Stock.check(old.name, qty + inCartOthers);
                        if (!c.available) { Toast.show(`⚠️ Stock insuffisant: ${c.stock}`, 'warning'); return; }
                    }
                    this.lines[idx] = { ...old, price, qty, total: price * qty };
                    this.editingRowIndex = null;
                    this.renderLines(); this.updateAccountSummary();
                },
                cancelEdit() { this.editingRowIndex = null; this.renderLines(); },
                renderLines() {
                    const b = $(cfg.linesBody);
                    if (!b) return;
                    let sum = 0;
                    if (!this.lines.length) {
                        b.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:16px;color:#2980b9;font-size:11px;background:#e3f2fd;">
                            💰 <b>Facture de règlement</b><br><span style="font-size:9px;opacity:0.8;">Aucun produit</span>
                        </td></tr>`;
                        $(cfg.grandTotal).textContent = '0.000 TND';
                        if (cfg.paymentOnlyNotice && $(cfg.paymentOnlyNotice)) $(cfg.paymentOnlyNotice).style.display = 'block';
                        return;
                    }
                    if (cfg.paymentOnlyNotice && $(cfg.paymentOnlyNotice)) $(cfg.paymentOnlyNotice).style.display = 'none';
                    b.innerHTML = this.lines.map((l, i) => {
                        sum += l.total;
                        if (this.editingRowIndex === i) {
                            return `<tr><td>${i+1}</td><td class="item-name">${esc(l.name)}</td>
                                <td><input type="number" step="0.001" value="${l.price}" class="edit-input edit-price"></td>
                                <td><input type="number" min="1" value="${l.qty}" class="edit-input edit-qty"></td>
                                <td class="item-total">${l.total.toFixed(3)}</td>
                                <td><button class="btn-action save-edit" onclick="${cfg.name}.saveEditLine(${i})">💾</button>
                                <button class="btn-action cancel-edit" onclick="${cfg.name}.cancelEdit()">✕</button></td></tr>`;
                        }
                        return `<tr><td>${i+1}</td><td class="item-name">${esc(l.name)}</td>
                            <td>${l.price.toFixed(3)}</td><td>${l.qty}</td>
                            <td class="item-total">${l.total.toFixed(3)}</td>
                            <td><button class="btn-action edit" onclick="${cfg.name}.editLine(${i})">✏️</button>
                            <button class="btn-action delete" onclick="${cfg.name}.removeLine(${i})">✕</button></td></tr>`;
                    }).join('');
                    $(cfg.grandTotal).textContent = sum.toFixed(3) + ' TND';
                },
                renderReglements() {
                    const c = $(cfg.reglementsList);
                    if (!c) return;
                    if (!this.reglements.length) { c.innerHTML = '<span style="font-size:10px;color:var(--muted);">Aucun paiement</span>'; return; }
                    c.innerHTML = this.reglements.map((r, i) => `
                        <div class="payment-item">
                            <span class="method">${esc(r.method || 'Espèces')}</span>
                            <span class="amount">${r.amount.toFixed(3)} TND</span>
                            <span class="delete-payment" onclick="${cfg.name}.deleteReglement(${i})">✕</span>
                        </div>`).join('');
                    this.updateAccountSummary();
                },
                addReglement() {
                    const amount = parseFloat($(cfg.regAmount).value) || 0;
                    if (amount <= 0) { Toast.show('⚠️ Montant invalide', 'warning'); return; }
                    const method = $(cfg.regType).value;
                    const date = Utils.today();
                    const regId = State.nextId.reglements++;
                    this.reglements.push({ id: regId, date, amount, method });
                    const partyName = $(cfg.partySelect).options[$(cfg.partySelect).selectedIndex]?.textContent || '';
                    const party = cfg.partyList().find(p => p.name === partyName);
                    cfg.caisseList().push({
                        id: State.nextId[cfg.caisseTable]++,
                        date,
                        [cfg.caissePartyKey]: partyName,
                        [cfg.caissePartyKey.replace('Name','Id')]: party ? party.id : null,
                        type: cfg.caisseType, amount, regType: method,
                        description: 'Règlement de facture ' + $(cfg.numField).value,
                        invoiceId: this.editingId || null,
                        invoiceNum: $(cfg.numField).value,
                        reglementId: regId
                    });
                    Persistence.save();
                    if (party) BalanceCalculator.recalculate(cfg.balanceType, partyName);
                    this.renderReglements(); this.updateAccountSummary();
                    $(cfg.regAmount).value = '';
                    Toast.show('✅ Paiement ajouté');
                },
                deleteReglement(idx) {
                    const removed = this.reglements.splice(idx, 1)[0];
                    if (!removed) return;
                    const caisse = cfg.caisseList();
                    if (removed.id) {
                        const i = caisse.findIndex(c => c.reglementId === removed.id);
                        if (i !== -1) caisse.splice(i, 1);
                    }
                    Persistence.save();
                    const pn = $(cfg.partySelect).options[$(cfg.partySelect).selectedIndex]?.textContent || '';
                    if (pn) BalanceCalculator.recalculate(cfg.balanceType, pn);
                    this.renderReglements(); this.updateAccountSummary();
                },
                updateAccountSummary() {
                    const total = this.lines.reduce((a, l) => a + l.total, 0);
                    const paid = this.reglements.reduce((a, r) => a + r.amount, 0);
                    const cur = this.originalBalance + total - paid;
                    $(cfg.prevBalance).textContent = this.originalBalance.toFixed(3);
                    $(cfg.invoiceTotal).textContent = total.toFixed(3);
                    $(cfg.paidAmount).textContent = paid.toFixed(3);
                    $(cfg.currentBalance).textContent = cur.toFixed(3);
                },
                async save() {
                    if (State.isSaving) { Toast.show('⏳ Enregistrement...'); return; }
                    if (this.editingRowIndex !== null) { Toast.show('⚠️ Terminez la modification', 'warning'); return; }
                    if (!$(cfg.partySelect).value) { Toast.show('⚠️ Choisissez une partie', 'warning'); return; }
                    const isPaymentOnly = !this.lines.length && this.reglements.length > 0;
                    if (!this.lines.length && !this.reglements.length) {
                        Toast.show('⚠️ Ajoutez un produit OU un règlement', 'warning'); return;
                    }
                    if (isPaymentOnly) {
                        const totalPaid = this.reglements.reduce((a, r) => a + r.amount, 0);
                        const ok = await CustomConfirm.show(
                            '💡 Aucun produit.\n\nEnregistrer comme RÈGLEMENT uniquement ?\n\n' +
                            '• Montant: ' + totalPaid.toFixed(3) + ' TND',
                            'Confirmation'
                        );
                        if (!ok) return;
                    }
                    const pn = $(cfg.partySelect).options[$(cfg.partySelect).selectedIndex].textContent;
                    const party = cfg.partyList().find(p => p.name === pn);
                    if (!party) return;
                    const total = this.lines.reduce((a, l) => a + l.total, 0);
                    const isNew = !this.editingId;
                    const id = this.editingId || State.nextId[cfg.table]++;
                    const oldRec = isNew ? null : cfg.list().find(x => x.id === this.editingId);
                    const oldLines = oldRec?.lines || [];
                    const stockDeltas = {};
                    oldLines.forEach(l => { stockDeltas[l.name] = (stockDeltas[l.name] || 0) + l.qty; });
                    this.lines.forEach(l => { stockDeltas[l.name] = (stockDeltas[l.name] || 0) - l.qty; });
                    const rec = {
                        id, num: $(cfg.numField).value, date: $(cfg.dateField).value,
                        [cfg.partyKey]: pn, lines: [...this.lines], total,
                        reglements: [...this.reglements],
                        prevBalance: this.originalBalance,
                        [cfg.taxIdField]: party.taxId || '',
                        [cfg.addressField]: party.address || '',
                        isPaymentOnly: isPaymentOnly
                    };
                    if (cfg.emailField) rec[cfg.emailField] = party.login || party.email || '';
                    State.isSaving = true;
                    const skipStockAdjust = this._skipStockAdjust === true;
                    this._skipStockAdjust = false;
                    const deltasApplied = [];
                    try {
                        if (!skipStockAdjust) {
                            Object.entries(stockDeltas).forEach(([name, delta]) => {
                                if (delta === 0) return;
                                const applied = Stock.adjust(name, cfg.isPurchase ? -delta : delta, {
                                    silent: true, allowNegative: true
                                });
                                if (applied) deltasApplied.push([name, cfg.isPurchase ? -delta : delta]);
                            });
                        }
                        const list = cfg.list();
                        if (isNew) list.push(rec);
                        else {
                            const idx = list.findIndex(x => x.id === this.editingId);
                            if (idx === -1) throw new Error('Not found');
                            list[idx] = rec;
                        }
                        Persistence.save();
                        BalanceCalculator.recalculate(cfg.balanceType, pn);
                        cfg.renderer.render();
                        this.editingId = rec.id;
                        this.originalBalance = party.balance;
                        this.updateAccountSummary();
                        this.isSaved = true;
                        Toast.show(isNew ? '✅ Enregistré' : '✅ Modifié', 'success');
                    } catch(e) {
                        deltasApplied.forEach(([name, delta]) => {
                            Stock.adjust(name, -delta, { silent: true, allowNegative: true });
                        });
                        Toast.show('❌ Erreur — stock restauré', 'error');
                    } finally {
                        State.isSaving = false;
                    }
                },
                edit() {
                    if (this.editingId == null) { Toast.show('⚠️ Choisissez'); return; }
                    this.save();
                },
                async remove() {
                    if (this.editingId == null) { Toast.show('⚠️ Choisissez'); return; }
                    const rec = cfg.list().find(x => x.id === this.editingId);
                    if (!rec) return;
                    const ok = await CustomConfirm.show(`Supprimer ${rec.num} ?`);
                    if (!ok) return;
                    rec.lines.forEach(l => {
                        Stock.adjust(l.name, cfg.isPurchase ? -l.qty : l.qty, { silent: true, allowNegative: true });
                    });
                    const caisse = cfg.caisseList();
                    for (let i = caisse.length - 1; i >= 0; i--) {
                        if (caisse[i].invoiceId === this.editingId) caisse.splice(i, 1);
                    }
                    const list = cfg.list();
                    const idx = list.findIndex(x => x.id === this.editingId);
                    list.splice(idx, 1);
                    Persistence.save();
                    BalanceCalculator.recalculate(cfg.balanceType, rec[cfg.partyKey]);
                    cfg.renderer.render();
                    App.closeSheet();
                    Toast.show('🗑️ Supprimé');
                },
                load(id) {
                    const r = cfg.list().find(x => x.id === id);
                    if (!r) return;
                    this.editingId = id;
                    $(cfg.numField).value = r.num;
                    $(cfg.dateField).value = r.date;
                    $(cfg.numDisplay).textContent = '#' + r.num;
                    $(cfg.dateDisplay).textContent = Utils.formatDate(r.date);
                    const pn = r[cfg.partyKey];
                    const opt = [...$(cfg.partySelect).options].find(o => o.textContent === pn);
                    if (opt) $(cfg.partySelect).value = opt.value;
                    const p = cfg.partyList().find(x => x.name === pn);
                    const paid = (r.reglements || []).reduce((a, x) => a + x.amount, 0);
                    this.originalBalance = r.prevBalance !== undefined ? r.prevBalance : (p ? p.balance - (r.total - paid) : 0);
                    this.originalPartyId = p ? p.id : null;
                    this.partyTaxId = r[cfg.taxIdField] || (p ? p.taxId || '' : '');
                    this.partyAddress = r[cfg.addressField] || (p ? p.address || '' : '');
                    this.partyEmail = cfg.emailField ? (r[cfg.emailField] || (p ? (p.login || p.email) || '' : '')) : '';
                    this.partySpecialPrices = p?.specialPrices ? [...p.specialPrices] : [];
                    $(cfg.partyPhone).textContent = p ? p.phone : '-';
                    if (cfg.partyEmail) $(cfg.partyEmail).textContent = this.partyEmail || '-';
                    if (cfg.partyTaxId) $(cfg.partyTaxId).textContent = this.partyTaxId || '-';
                    this.lines = [...r.lines];
                    this.reglements = r.reglements ? [...r.reglements] : [];
                    this.editingRowIndex = null;
                    this.isSaved = true;
                    this.renderLines(); this.refreshArticleOptions();
                    this.renderReglements(); this.updateAccountSummary();
                    App.openSheet(cfg.sheet);
                },
                printInvoice() {
                    if (this.editingId == null) { Toast.show('⚠️ Enregistrez'); return; }
                    const rec = cfg.list().find(x => x.id === this.editingId);
                    if (!rec) return;
                    const p = cfg.partyList().find(x => x.name === rec[cfg.partyKey]);
                    const paid = (rec.reglements || []).reduce((a, r) => a + r.amount, 0);
                    const prevBalance = rec.prevBalance !== undefined ? rec.prevBalance : (p ? p.balance - (rec.total - paid) : 0);
                    PreviewModal.showInvoice({
                        title: cfg.isPurchase ? "Facture d'achat" : 'Facture de vente',
                        num: rec.num, date: rec.date,
                        partyLabel: cfg.isPurchase ? 'Fournisseur' : 'Client',
                        partyName: rec[cfg.partyKey],
                        partyPhone: p ? p.phone : '',
                        partyTaxId: rec[cfg.taxIdField] || '',
                        lines: rec.lines || [], total: rec.total, paid,
                        prevBalance, currentBalance: prevBalance + rec.total - paid
                    });
                },
                printBluetooth() {
                    if (this.editingId == null) { Toast.show('⚠️ Enregistrez'); return; }
                    const rec = cfg.list().find(x => x.id === this.editingId);
                    if (!rec) return;
                    const paid = (rec.reglements || []).reduce((a, r) => a + r.amount, 0);
                    const prevBalance = rec.prevBalance || 0;
                    let text = `${State.companyInfo.name}\n${rec.num}\n${rec.date}\n${rec[cfg.partyKey]}\n`;
                    if (!rec.lines || !rec.lines.length) text += `💰 REGLEMENT\n`;
                    else rec.lines.forEach(l => { text += `${l.name} ${l.qty}x${l.price.toFixed(3)}=${l.total.toFixed(3)}\n`; });
                    text += `Total: ${rec.total.toFixed(3)}\nPayé: ${paid.toFixed(3)}\nSolde: ${(prevBalance + rec.total - paid).toFixed(3)}\n`;
                    Bluetooth.print(text);
                },
                async shareWhatsapp() {
                    if (this.editingId == null) { Toast.show('⚠️ Enregistrez'); return; }
                    const rec = cfg.list().find(x => x.id === this.editingId);
                    if (!rec) return;
                    const paid = (rec.reglements || []).reduce((a, r) => a + r.amount, 0);
                    const phone = cfg.partyList().find(x => x.name === rec[cfg.partyKey])?.phone || '';
                    const formatted = phone.replace(/\D/g, '');
                    const text = `📄 *${rec.num}*\n📅 ${rec.date}\n👤 ${rec[cfg.partyKey]}\n💰 ${rec.total.toFixed(3)} TND\n💳 ${paid.toFixed(3)} TND\n📊 ${(rec.total - paid).toFixed(3)} TND\n\n${State.companyInfo.name}`;
                    window.open('https://wa.me/' + (formatted ? '216' + formatted : '') + '?text=' + encodeURIComponent(text), '_blank');
                    Toast.show('✅ WhatsApp ouvert', 'success');
                }
            };
        }
